outer IDs must be unique rather than matching, and interface priority doesn't need to match either."}, {"id": "m2-2.7.5-5", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What are two features of the OSPF routing protocol? (Choose two.)", "choices": ["used primarily as an EGP", "uses Dijkstra's algorithm to build the SPF tree", "has an administrative distance of 100", "automatically summarizes networks at the classful boundaries", "calculates its metric using bandwidth"], "correct": ["uses Dijkstra's algorithm to build the SPF tree", "calculates its metric using bandwidth"], "multi": true, "explanation": "OSPF is an interior gateway protocol (not an EGP), has a default administrative distance of 110 (not 100), and is classless without automatic summarization. It does use Dijkstra's SPF algorithm and bases its cost metric on bandwidth."}, {"id": "m2-2.7.5-6", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "A router with two LAN interfaces, two WAN interfaces, and one configured loopback interface is operating with OSPF as its routing protocol. What does the router OSPF process use to assign the router ID?", "choices": ["the loopback interface IP address", "the highest IP address on the LAN interfaces", "the OSPF area ID that is configured on the interface with the highest IP address", "the IP address of the interface that is configured with priority 0", "the highest IP address that is configured on the WAN interfaces"], "correct": ["the loopback interface IP address"], "multi": false, "explanation": "Without a manually configured router-id, OSPF prefers the IP address of a configured loopback interface over any physical LAN or WAN interface address, regardless of which physical interface has the numerically higher address."}, {"id": "m2-2.7.5-7", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which verification command would identify the specific interfaces on a router that were configured with the passive-interface command?", "choices": ["show ip protocols", "show ip eigrp neighbors", "show ip interface brief", "show ip route eigrp"], "correct": ["show ip protocols"], "multi": false, "explanation": "show ip protocols lists which interfaces on the router have been set as passive."}, {"id": "m2-2.7.5-8", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which command, if applied on an OSPF router, would give a Gigabit Ethernet interface a lower cost than a Fast Ethernet interface?", "choices": ["(config-if)# bandwidth 100", "(config-if)# ip ospf priority 1", "(config-router)# auto-cost reference-bandwidth 1000", "(config-if)# ip ospf cost 100"], "correct": ["(config-router)# auto-cost reference-bandwidth 1000"], "multi": false, "explanation": "OSPF cost equals a reference bandwidth divided by the interface bandwidth, rounded to an integer, so by default anything 100 Mb/s or faster all costs 1 and can't be distinguished. Raising the reference bandwidth to 1000 (meaning 1000 Mb/s, i.e. Gigabit speed) lets Gigabit interfaces get a lower cost than Fast Ethernet ones."}, {"id": "m2-2.7.5-9", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "A network administrator has just changed the router ID on a router that is working in an OSPFv2 environment. What should the administrator do to reset the adjacencies and use the new router ID?", "choices": ["Configure the network statements.", "Change the OSPFv2 process ID.", "Issue the clear ip ospf process privileged mode command.", "Change the interface priority."], "correct": ["Issue the clear ip ospf process privileged mode command."], "multi": false, "explanation": "Changing the router ID doesn't take effect on a running router until the OSPF process is restarted, which is done with clear ip ospf process."}, {"id": "m2-2.7.5-10", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which command can be used to view the OSPF hello and dead time intervals?", "choices": ["show ip ospf route", "show ip protocols", "show ip ospf interface", "show ip ospf neighbor"], "correct": ["show ip ospf interface"], "multi": false, "explanation": "Hello and dead timers are configured per interface, so show ip ospf interface (optionally with the interface name) is what displays them."}, {"id": "m2-2.7.5-11", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What does the SPF algorithm consider to be the best path to a network?", "choices": ["The path that includes the fastest cumulative bandwidth links.", "The path with the least number of hops.", "The path with the smallest delays.", "The path that includes the fastest single bandwidth link."], "correct": ["The path that includes the fastest cumulative bandwidth links."], "multi": false, "explanation": "OSPF's cost is accumulated across every link in the path based on bandwidth, so the best path is the one with the fastest overall (cumulative) bandwidth end-to-end -- not simply the fewest hops or the speed of any single link."}, {"id": "m2-2.7.5-12", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What is one use of the router ID in OSPF routing?", "choices": ["The router ID indicates the highest IPv4 address of all routers that are participating in OSPF routing.", "The router ID identifies the OSPF area.", "The router ID can be used to break a tie in the election process.", "The router ID indicates the router priority value."], "correct": ["The router ID can be used to break a tie in the election process."], "multi": false, "explanation": "If router priority values are tied (or not configured) during a DR/BDR election, the router with the highest router ID wins the tiebreaker. The router ID doesn't identify an area or indicate a priority value on its own."}, {"id": "m2-2.7.5-13", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What is the first criterion used by OSPF routers to elect a DR?", "choices": ["highest priority", "highest router ID", "highest MAC address", "highest IP address"], "correct": ["highest priority"], "multi": false, "explanation": "DR election looks at OSPF interface priority first; only if priorities are tied does the router ID become the tiebreaker."}, {"id": "m2-2.7.5-14", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which command could be used on a router to ensure that an OSPF adjacency is formed with another router?", "choices": ["show ip protocols", "show ip ospf interface", "show ip route", "show ip ospf neighbor", "show ip interface brief"], "correct": ["show ip ospf neighbor"], "multi": false, "explanation": "show ip ospf neighbor is the go-to command for confirming that adjacencies have actually formed, particularly when an expected route is missing from the routing table."}, {"id": "m2-2.7.5-15", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "A router in an OSPF enterprise network has a default static route that has been configured via the interface that connects to the ISP. Which command would the network administrator apply on this router so that other routers in the OSPF network will use this default route?", "choices": ["redistribute connected", "redistribute static", "redistribute static subnets", "default-information originate"], "correct": ["default-information originate"], "multi": false, "explanation": "default-information originate tells the router to advertise itself as the source of a default route and propagate that static default route to the rest of the OSPF area."}, {"id": "m2-2.7.5-16", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "A router is participating in an OSPFv2 domain. What will always happen if the Dead interval expires before the router receives a Hello packet from an adjacent OSPF router?", "choices": ["A new Dead interval timer of four times the Hello interval will start.", "OSPF will remove that neighbor from the router's link-state database.", "OSPF will run a new DR/BDR election.", "SPF will run and determine which neighbor router is down."], "correct": ["OSPF will remove that neighbor from the router's link-state database."], "multi": false, "explanation": "Once the dead interval (four times the hello interval by default) expires without a Hello, the router always drops that neighbor from its link-state database. A new DR/BDR election isn't guaranteed -- it depends on the network type and whether the lost router held the DR or BDR role -- and SPF only computes routes, not neighbor status."}, {"id": "m2-2.7.5-17", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which command would be used to determine if an OSPF routing protocol-initiated relationship had been made with an adjacent router?", "choices": ["ping", "show ip interface brief", "show ip ospf neighbor", "show ip protocols"], "correct": ["show ip ospf neighbor"], "multi": false, "explanation": "Only show ip ospf neighbor confirms whether two routers have actually exchanged OSPF messages and formed a neighbor relationship; ping and show ip interface brief only confirm lower-layer connectivity, and show ip protocols shows general routing parameters rather than adjacency status."}, {"id": "m2-2.7.5-18", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which command is used to verify the OSPFv2 router ID, the interfaces explicitly configured to advertise OSPF routes, the passive interfaces, the neighbors the router is receiving updates from, and the default administrative distance, which is 110 for OSPF?", "choices": ["show ip interface brief", "show ip ospf interface", "show ip protocols", "show ip route ospf"], "correct": ["show ip protocols"], "multi": false, "explanation": "show ip protocols is the command that summarizes the router ID, advertised networks, passive interfaces, neighbor sources, and administrative distance for the routing process."}, {"id": "m2-2.7.5-19", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Two OSPFv2 routers are interconnected using a point-to-point WAN link. Which command could be used to verify the configured Hello and Dead timer intervals?", "choices": ["show ip ospf neighbor", "show ip ospf interface fastethernet 0/1", "show ip ospf interface serial 0/0/0", "show ipv6 ospf interface serial 0/0/0"], "correct": ["show ip ospf interface serial 0/0/0"], "multi": false, "explanation": "Since the link in question is a point-to-point serial WAN link running OSPFv2, show ip ospf interface serial 0/0/0 is the command that shows the configured Hello and Dead timers on that specific interface. The FastEthernet version applies to a multiaccess link, the IPv6 version applies to OSPFv3, and show ip ospf neighbor only shows elapsed dead time, not the configured interval."}, {"id": "m2-2.7.5-20", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "You are troubleshooting convergence and adjacency issues in an OSPFv2 network and have noticed that network route entries are missing from the routing table. Which commands provide additional information about the state of router adjacencies, timer intervals, and the area ID? (Choose two.)", "choices": ["show ip ospf interface", "show ip ospf neighbor", "show ip protocols", "show ip route ospf", "show running-configuration"], "correct": ["show ip ospf interface", "show ip ospf neighbor"], "multi": true, "explanation": "show ip ospf interface and show ip ospf neighbor are the commands that expose adjacency state, timer values, and area ID details. show running-configuration and show ip protocols only surface general configuration, not adjacency or timer state."}, {"id": "m2-2.7.5-21", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "A network engineer has manually configured the Hello interval to 15 seconds on an interface of a router that is running OSPFv2. By default, how will the Dead interval on the interface be affected?", "choices": ["The Dead interval will not change from the default value.", "The Dead interval will now be 15 seconds.", "The Dead interval will now be 30 seconds.", "The Dead interval will now be 60 seconds."], "correct": ["The Dead interval will now be 60 seconds."], "multi": false, "explanation": "Cisco IOS automatically recalculates the Dead interval as four times whatever the Hello interval is set to, so 15 seconds becomes 60 seconds."}, {"id": "m2-2.7.5-22", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "To establish a neighbor adjacency, two OSPF routers exchange Hello packets. Which values in the Hello packets must match on the two routers? (Choose two.)", "choices": ["1. Dead interval", "2. Hello interval", "3. List of neighbors", "4. Router ID", "5. Router priority"], "correct": ["1. Dead interval", "2. Hello interval"], "multi": true, "explanation": "The Hello and Dead interval timers carried in the Hello packet must match between neighboring routers for an adjacency to form; the list of neighbors, router ID, and router priority don't need to match."}, {"id": "m2-2.7.5-23", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What is the default router priority value for all Cisco OSPF routers?", "choices": ["0", "1", "10", "255"], "correct": ["1"], "multi": false, "explanation": "OSPF router priority defaults to 1 on Cisco routers, though it can be manually set anywhere from 0 to 255."}, {"id": "m2-2.7.5-24", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "What indicates to a link-state router that a neighbor is unreachable?", "choices": ["The router no longer receives Hello packets.", "The router no longer receives routing updates.", "The router receives an LSP with previously learned information.", "The router receives an update with a hop count of 16."], "correct": ["The router no longer receives Hello packets."], "multi": false, "explanation": "OSPF routers use Hello packets to monitor neighbor state; once Hellos stop arriving from a neighbor (and the dead interval elapses), that neighbor is considered unreachable and the adjacency breaks."}, {"id": "m2-2.7.5-25", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which of the following will OSPF use when it chooses its router ID?", "choices": ["A loopback interface that is configured with the highest IP address on the router", "The highest active interface IP address that is configured on the router", "The lowest active interface IP address that is configured on the router", "The highest active interface that participates in the routing process because of a specifically configured network statement"], "correct": ["A loopback interface that is configured with the highest IP address on the router"], "multi": false, "explanation": "Absent a manually configured router-id, OSPF next prefers the highest IPv4 address among configured loopback interfaces (since loopbacks are stable, non-routable addresses), and only falls back to the highest active physical interface address if no loopback exists."}, {"id": "m2-2.7.5-26", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "An OSPF router has three directly connected networks: 10.1.0.0/16, 10.1.1.0/16, and 10.1.2.0/16. Which OSPF network command would advertise only the 10.1.1.0 network to neighbors?", "choices": ["router(config-router)# network 10.1.0.0 0.0.15.255 area 0", "router(config-router)# network 10.1.1.0 0.0.0.0 area 0", "router(config-router)# network 10.1.1.0 0.0.0.255 area 0", "router(config-router)# network 10.1.1.0 0.0.255.255 area 0"], "correct": ["router(config-router)# network 10.1.1.0 0.0.0.255 area 0"], "multi": false, "explanation": "To match only the 10.1.1.0 network, the wildcard mask needs to match the first 24 bits exactly, which the 0.0.0.255 wildcard does (equivalent to a 255.255.255.0 mask)."}, {"id": "m2-2.7.5-27", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "By default, what is the OSPF cost for a link with Gigabit Ethernet interfaces?", "choices": ["1", "100", "10000", "100000000"], "correct": ["1"], "multi": false, "explanation": "With the default reference bandwidth, OSPF's cost formula rounds any bandwidth of 100 Mb/s or higher down to an integer cost of 1, so Gigabit Ethernet defaults to a cost of 1."}, {"id": "m2-2.7.5-28", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "An administrator is configuring single-area OSPF on a router. One of the networks that must be advertised is 64.100.1.64 255.255.255.192. Which OSPF network statement should be configured?", "choices": ["network 64.100.1.64 0.0.0.15 area 0", "network 64.100.1.64 0.0.0.31 area 0", "network 64.100.1.64 0.0.0.63 area 0", "network 64.100.1.64 0.0.0.127 area 0"], "correct": ["network 64.100.1.64 0.0.0.63 area 0"], "multi": false, "explanation": "The subnet mask 255.255.255.192 (/26) has a wildcard equivalent of 0.0.0.63 (255.255.255.255 minus 255.255.255.192), so that's the wildcard mask the network statement needs."}, {"id": "m2-2.7.5-29", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which of these factors will prevent two routers from forming an OSPFv2 adjacency? (Choose two.)", "choices": ["Mismatched Cisco IOS versions", "Mismatched Ethernet interfaces (for example, Fa0/0 to G0/0)", "Mismatched OSPF Hello or Dead timers", "Mismatched subnet masks on the link interfaces", "Use of private IP addresses on the link interfaces"], "correct": ["Mismatched OSPF Hello or Dead timers", "Mismatched subnet masks on the link interfaces"], "multi": true, "explanation": "Adjacencies fail to form over mismatched subnet masks, mismatched Hello/Dead timers, mismatched network types, or a missing/incorrect network command. Differing IOS versions, differing physical interface types, and the use of private addressing don't by themselves prevent adjacency formation."}],  "module3": [{"id":"m3-3.1.4-1","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe anything of value to the organization? It includes people, equipment, resources, and data.","choices":["Vulnerability","Exploit","Asset","Risk"],"correct":["Asset"],"multi":false,"explanation":"An asset is anything of value to the organization. It includes people, equipment, resources, and data."},{"id":"m3-3.1.4-2","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe a weakness in a system, or its design, that could be exploited by a threat?","choices":["Vulnerability","Asset","Risk","Mitigation"],"correct":["Vulnerability"],"multi":false,"explanation":"A vulnerability is a weakness in a system, or its design, that could be exploited by a threat."},{"id":"m3-3.1.4-3","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe a potential danger to a company's assets, data, or network functionality?","choices":["Vulnerability","Exploit","Threat","Risk"],"correct":["Threat"],"multi":false,"explanation":"A threat is a potential danger to a company's assets, data, or network functionality."},{"id":"m3-3.1.4-4","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe a mechanism that takes advantage of a vulnerability?","choices":["Exploit","Threat","Risk","Mitigation"],"correct":["Exploit"],"multi":false,"explanation":"An exploit is a mechanism that takes advantage of a vulnerability."},{"id":"m3-3.1.4-5","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe the counter-measure for a potential threat or risk?","choices":["Vulnerability","Exploit","Asset","Mitigation"],"correct":["Mitigation"],"multi":false,"explanation":"Mitigation is the counter-measure for a potential threat or risk."},{"id":"m3-3.1.4-6","section":"3.1.4","sectionTitle":"Check Your Understanding - Current State of Cybersecurity","question":"Which security term is used to describe the likelihood of a threat to exploit the vulnerability of an asset, with the aim of negatively affecting an organization?","choices":["Vulnerability","Exploit","Threat","Risk"],"correct":["Risk"],"multi":false,"explanation":"Risk is the likelihood of a threat to exploit the vulnerability of an asset, with the aim of negatively affecting an organization."},{"id":"m3-3.2.6-1","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"A hacker remotely broke into ATM machines using a laptop, then worked with ATM manufacturers to resolve the security vulnerabilities discovered. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["Gray Hat"],"multi":false,"explanation":"Gray hat hackers commit crimes and do arguably unethical things, but not for personal gain or to cause damage. They may disclose a vulnerability to the affected organization after having compromised their network."},{"id":"m3-3.2.6-2","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"A hacker transferred  million to a personal bank account using victim account numbers and PINs captured by recording victims entering them. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["Black Hat"],"multi":false,"explanation":"Black hat hackers are unethical criminals who compromise computer and network security for personal gain, or for malicious reasons, such as attacking networks."},{"id":"m3-3.2.6-3","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"A person's job is to identify weaknesses in their company's network. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["White Hat"],"multi":false,"explanation":"White hat hackers use their programming skills for good, ethical, and legal purposes."},{"id":"m3-3.2.6-4","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"A hacker used malware to compromise several corporate systems to steal credit card information, then sold that information to the highest bidder. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["Black Hat"],"multi":false,"explanation":"Black hat hackers are unethical criminals who compromise computer and network security for personal gain, or for malicious reasons, such as attacking networks."},{"id":"m3-3.2.6-5","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"During research for security exploits, a person stumbled across a security vulnerability on a corporate network that they are authorized to access. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["White Hat"],"multi":false,"explanation":"White hat hackers use their programming skills for good, ethical, and legal purposes."},{"id":"m3-3.2.6-6","section":"3.2.6","sectionTitle":"Check Your Understanding - Threat Actors","question":"A person's job is to work with technology companies to fix a flaw with DNS. Which type of hacker is this?","choices":["White Hat","Gray Hat","Black Hat"],"correct":["White Hat"],"multi":false,"explanation":"White hat hackers use their programming skills for good, ethical, and legal purposes."},{"id":"m3-3.3.5-1","section":"3.3.5","sectionTitle":"Check Your Understanding - Threat Actor Tools","question":"Which penetration testing tool uses algorithm schemes to encode the data, which then prevents access to the data?","choices":["Packet Sniffers","Encryption Tools","Vulnerability Exploitation Tools","Forensic Tools","Debuggers"],"correct":["Encryption Tools"],"multi":false,"explanation":"Encryption Tools use algorithm schemes to encode the data, preventing unauthorized access to the encrypted data."},{"id":"m3-3.3.5-2","section":"3.3.5","sectionTitle":"Check Your Understanding - Threat Actor Tools","question":"Which penetration testing tool is used by black hats to reverse engineer binary files when writing exploits, and also used by white hats when analyzing malware?","choices":["Packet Crafting Tools","Rootkit Detectors","Vulnerability Exploitation Tools","Forensic Tools","Debuggers"],"correct":["Debuggers"],"multi":false,"explanation":"Debuggers are used by black hats to reverse engineer binary files when writing exploits. They are also used by white hats when analyzing malware."},{"id":"m3-3.3.5-3","section":"3.3.5","sectionTitle":"Check Your Understanding - Threat Actor Tools","question":"Which penetration testing tool is used to probe and test a firewall's robustness?","choices":["Packet Crafting Tools","Encryption Tools","Rootkit Detectors","Forensic Tools","Debuggers"],"correct":["Packet Crafting Tools"],"multi":false,"explanation":"Packet Crafting Tools are used to probe and test a firewall's robustness using specially crafted forged packets."},{"id":"m3-3.3.5-4","section":"3.3.5","sectionTitle":"Check Your Understanding - Threat Actor Tools","question":"Which penetration testing tool is used by white hat hackers to sniff out any trace of evidence existing in a computer?","choices":["Fuzzers to Search Vulnerabilities","Encryption Tools","Packet Sniffers","Forensic Tools","Debuggers"],"correct":["Forensic Tools"],"multi":false,"explanation":"Forensic Tools are used by white hat hackers to sniff out any trace of evidence existing in a computer."},{"id":"m3-3.3.5-5","section":"3.3.5","sectionTitle":"Check Your Understanding - Threat Actor Tools","question":"Which penetration testing tool identifies whether a remote host is susceptible to a security attack?","choices":["Packet Sniffers","Encryption Tools","Vulnerability Exploitation Tools","Forensic Tools","Debuggers"],"correct":["Vulnerability Exploitation Tools"],"multi":false,"explanation":"Vulnerability Exploitation Tools identify whether a remote host is vulnerable to a security attack."},{"id":"m3-3.4.4-1","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware executes arbitrary code and installs copies of itself in the memory of the infected computer, with the main purpose of automatically replicating from system to system across the network?","choices":["Adware","Rootkit","Spyware","Virus","Worm"],"correct":["Worm"],"multi":false,"explanation":"A worm executes arbitrary code and installs copies of itself in memory. Its main purpose is to automatically replicate from system to system across the network."},{"id":"m3-3.4.4-2","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware is a non-self-replicating type that often contains malicious code designed to look like a legitimate application or file, and attacks the device from within?","choices":["Adware","Rootkit","Spyware","Trojan Horse","Worm"],"correct":["Trojan Horse"],"multi":false,"explanation":"A Trojan horse is a non-self-replicating type of malware that contains malicious code designed to look like a legitimate application. It attacks the device from within."},{"id":"m3-3.4.4-3","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware is used to gather information about a user and then, without the user's consent, sends the information to another entity?","choices":["Adware","Rootkit","Spyware","Virus","Ransomware"],"correct":["Spyware"],"multi":false,"explanation":"Spyware gathers information about the user and sends it to threat actors without consent. It can range from low threat (browsing data) to high threat (personal and financial information)."},{"id":"m3-3.4.4-4","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware typically displays annoying pop-ups to generate revenue for its author?","choices":["Adware","Rootkit","Spyware","Virus","Worm"],"correct":["Adware"],"multi":false,"explanation":"Adware is usually distributed by downloading online software. It displays unsolicited advertising using pop-up windows, new toolbars, or unexpected webpage redirects."},{"id":"m3-3.4.4-5","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware is installed on a compromised system and provides privileged access to the threat actor?","choices":["Adware","Virus","Spyware","Rootkit","Worm"],"correct":["Rootkit"],"multi":false,"explanation":"Rootkits are used by threat actors to gain administrator account-level access to a computer. They are very difficult to detect because they can alter firewall, antivirus protection, system files, and OS commands to conceal their presence."},{"id":"m3-3.4.4-6","section":"3.4.4","sectionTitle":"Check Your Understanding - Malware","question":"Which malware denies access to the infected computer system and demands payment before the restriction is removed?","choices":["Adware","Rootkit","Spyware","Virus","Ransomware"],"correct":["Ransomware"],"multi":false,"explanation":"Ransomware typically denies a user access to their files by encrypting them and then displaying a message demanding a ransom for the decryption key."},{"id":"m3-3.5.10-1","section":"3.5.10","sectionTitle":"Check Your Understanding - Common Network Attacks","question":"What type of attack is tailgating?","choices":["Reconnaissance","Access","DoS","Social Engineering"],"correct":["Social Engineering"],"multi":false,"explanation":"Tailgating is a social engineering attack where a threat actor quickly follows an authorized person into a secure location to gain access."},{"id":"m3-3.5.10-2","section":"3.5.10","sectionTitle":"Check Your Understanding - Common Network Attacks","question":"What type of attack is a password attack?","choices":["Reconnaissance","Access","DoS","Social Engineering"],"correct":["Access"],"multi":false,"explanation":"Password attacks are a form of access attack in which the threat actor attempts to discover critical system passwords using various methods including cracking tools."},{"id":"m3-3.5.10-3","section":"3.5.10","sectionTitle":"Check Your Understanding - Common Network Attacks","question":"What type of attack is port scanning?","choices":["Reconnaissance","Access","DoS","Social Engineering"],"correct":["Reconnaissance"],"multi":false,"explanation":"Port scanning is a reconnaissance attack in which a threat actor uses a tool like Nmap to scan for open ports on discovered active IP addresses."},{"id":"m3-3.5.10-4","section":"3.5.10","sectionTitle":"Check Your Understanding - Common Network Attacks","question":"What type of attack is man-in-the-middle?","choices":["Reconnaissance","Access","DoS","Social Engineering"],"correct":["Access"],"multi":false,"explanation":"Man-in-the-Middle is an access attack in which the threat actor is positioned between two legitimate entities to read or modify the data that passes between the two parties."},{"id":"m3-3.5.10-5","section":"3.5.10","sectionTitle":"Check Your Understanding - Common Network Attacks","question":"What type of attack is address spoofing?","choices":["Reconnaissance","Access","DoS","Social Engineering"],"correct":["Access"],"multi":false,"explanation":"Spoofing is an access attack in which the threat actor device attempts to pose as another device by falsifying data. Common spoofing attacks include IP, MAC, and DHCP spoofing."},{"id":"m3-3.6.7-1","section":"3.6.7","sectionTitle":"Check Your Understanding - IP Vulnerabilities and Threats","question":"Which attack is used when threat actors position themselves between a source and destination to transparently monitor, capture, and control the communication?","choices":["Address Spoofing Attack","Amplification and Reflection Attacks","ICMP Attack","MiTM Attack","Session Hijacking"],"correct":["MiTM Attack"],"multi":false,"explanation":"A MiTM attack is when threat actors position themselves between a source and destination to transparently monitor, capture, and control the communication."},{"id":"m3-3.6.7-2","section":"3.6.7","sectionTitle":"Check Your Understanding - IP Vulnerabilities and Threats","question":"Which attack is used when threat actors gain access to the physical network, and then use a MiTM attack to capture and manipulate a legitimate user's traffic?","choices":["Address Spoofing Attack","Amplification and Reflection Attacks","ICMP Attack","MiTM Attack","Session Hijacking"],"correct":["Session Hijacking"],"multi":false,"explanation":"A session hijacking attack is when threat actors gain access to the physical network, then use a MiTM attack to capture and manipulate traffic, hijacking a legitimate user's session."},{"id":"m3-3.6.7-3","section":"3.6.7","sectionTitle":"Check Your Understanding - IP Vulnerabilities and Threats","question":"Which attack is used when threat actors initiate a simultaneous, coordinated attack from multiple source machines?","choices":["Address Spoofing Attack","Amplification and Reflection Attacks","ICMP Attack","MiTM Attack","Session Hijacking"],"correct":["Amplification and Reflection Attacks"],"multi":false,"explanation":"In an amplification attack, the threat actor forwards ICMP echo requests to many hosts with the victim's spoofed source IP. All those hosts reply to the victim, overwhelming it — this is the reflection component."},{"id":"m3-3.6.7-4","section":"3.6.7","sectionTitle":"Check Your Understanding - IP Vulnerabilities and Threats","question":"Which attack is used when threat actors use pings to discover subnets and hosts on a protected network, to generate flood attacks, and to alter host routing tables?","choices":["Address Spoofing Attack","Amplification and Reflection Attacks","ICMP Attack","MiTM Attack","Session Hijacking"],"correct":["ICMP Attack"],"multi":false,"explanation":"In ICMP attacks, threat actors use pings to discover subnets and hosts on a protected network, to generate flood attacks, and to alter host routing tables."},{"id":"m3-3.6.7-5","section":"3.6.7","sectionTitle":"Check Your Understanding - IP Vulnerabilities and Threats","question":"Which attack is used when a threat actor creates packets with false source IP address information to either hide the identity of the sender, or to pose as another legitimate user?","choices":["Address Spoofing Attack","Amplification and Reflection Attacks","ICMP Attack","MiTM Attack","Session Hijacking"],"correct":["Address Spoofing Attack"],"multi":false,"explanation":"An address spoofing attack involves creating packets with false source IP information to hide the sender's identity or pose as another user, allowing access to inaccessible data or circumventing security."},{"id":"m3-3.7.6-1","section":"3.7.6","sectionTitle":"Check Your Understanding - TCP and UDP Vulnerabilities","question":"Which attack exploits the three-way handshake?","choices":["TCP reset attack","UDP flood attack","TCP SYN Flood attack","DoS attack","TCP session hijacking"],"correct":["TCP SYN Flood attack"],"multi":false,"explanation":"The TCP SYN flood attack exploits the TCP three-way handshake."},{"id":"m3-3.7.6-2","section":"3.7.6","sectionTitle":"Check Your Understanding - TCP and UDP Vulnerabilities","question":"Two hosts have established a TCP connection and are exchanging data. A threat actor sends a TCP segment with the RST bit set to both hosts informing them to immediately stop using the TCP connection. Which attack is this?","choices":["TCP reset attack","UDP flood attack","TCP SYN Flood attack","DoS attack","TCP session hijacking"],"correct":["TCP reset attack"],"multi":false,"explanation":"A TCP reset attack can be used to terminate TCP communications between two hosts using a pair of FIN and ACK segments from each endpoint."},{"id":"m3-3.7.6-3","section":"3.7.6","sectionTitle":"Check Your Understanding - TCP and UDP Vulnerabilities","question":"Which attack is used when the threat actor spoofs the IP address of one host, predicts the next sequence number, and sends an ACK to the other host?","choices":["TCP reset attack","UDP flood attack","TCP SYN Flood attack","DoS attack","TCP session hijacking"],"correct":["TCP session hijacking"],"multi":false,"explanation":"TCP session hijacking is where the threat actor spoofs the IP address of one host, predicts the next sequence number, and sends an ACK to the other host. If successful, the threat actor can send data to, but not receive data from, the target device."},{"id":"m3-3.7.6-4","section":"3.7.6","sectionTitle":"Check Your Understanding - TCP and UDP Vulnerabilities","question":"A program sends a flood of UDP packets from a spoofed host to a server, sweeping through all known UDP ports looking for closed ports, causing the server to reply with ICMP port unreachable messages. Which attack is this?","choices":["TCP reset attack","UDP flood attack","TCP SYN Flood attack","DoS attack","TCP session hijacking"],"correct":["UDP flood attack"],"multi":false,"explanation":"A UDP flood attack sends a flood of UDP packets to the target's closed ports, causing ICMP port unreachable replies. The high traffic volume uses up most bandwidth, with an effect similar to a DoS attack."},{"id":"m3-3.9.6-1","section":"3.9.6","sectionTitle":"Check Your Understanding - Network Security Best Practices","question":"Which network security device ensures that internal traffic can go out and come back, but external traffic cannot initiate connections to inside hosts?","choices":["VPN","ASA Firewall","IPS","ESA/WSA","AAA Server"],"correct":["ASA Firewall"],"multi":false,"explanation":"A firewall, such as Cisco's ASA firewall, ensures that internal traffic can go out and come back, but external traffic cannot initiate connections to inside hosts."},{"id":"m3-3.9.6-2","section":"3.9.6","sectionTitle":"Check Your Understanding - Network Security Best Practices","question":"Which network security device contains a secure database of who is authorized to access and manage network devices?","choices":["VPN","ASA Firewall","IPS","ESA/WSA","AAA Server"],"correct":["AAA Server"],"multi":false,"explanation":"A AAA server contains a secure database of who is authorized to access and manage network devices."},{"id":"m3-3.9.6-3","section":"3.9.6","sectionTitle":"Check Your Understanding - Network Security Best Practices","question":"Which network security device filters known and suspicious internet malware sites?","choices":["VPN","ASA Firewall","IPS","ESA/WSA","AAA Server"],"correct":["ESA/WSA"],"multi":false,"explanation":"An ESA and a WSA filter known and suspicious internet malware sites."},{"id":"m3-3.9.6-4","section":"3.9.6","sectionTitle":"Check Your Understanding - Network Security Best Practices","question":"Which network security device provides secure services with corporate sites and remote access support for remote users using secure encrypted tunnels?","choices":["VPN","ASA Firewall","IPS","ESA/WSA","AAA Server"],"correct":["VPN"],"multi":false,"explanation":"A VPN provides secure services with corporate sites and remote access support for remote users using secure encrypted tunnels."},{"id":"m3-3.9.6-5","section":"3.9.6","sectionTitle":"Check Your Understanding - Network Security Best Practices","question":"Which network security device monitors incoming and outgoing traffic looking for malware and network attack signatures, and can immediately stop a recognized threat?","choices":["VPN","ASA Firewall","IPS","ESA/WSA","AAA Server"],"correct":["IPS"],"multi":false,"explanation":"An IPS monitors incoming and outgoing traffic looking for malware and network attack signatures. If it recognizes a threat, it can immediately stop it."},{"id":"m3-3.10.10-1","section":"3.10.10","sectionTitle":"Check Your Understanding - Cryptography","question":"Which encryption method repeats an algorithm process three times and is considered very trustworthy when implemented using very short key lifetimes?","choices":["Rivest Cipher","Triple DES","Block Cipher","Data Encryption Standard","Stream Cipher"],"correct":["Triple DES"],"multi":false,"explanation":"Triple DES (3DES) repeats an algorithm process three times and is considered very trustworthy when implemented using very short key lifetimes."},{"id":"m3-3.10.10-2","section":"3.10.10","sectionTitle":"Check Your Understanding - Cryptography","question":"Which encryption method encrypts plaintext one byte or one bit at a time?","choices":["Rivest Cipher","Block Cipher","Data Encryption Standard","Software Encryption algorithm","Stream Cipher"],"correct":["Stream Cipher"],"multi":false,"explanation":"A stream cipher encrypts one byte or one bit at a time."},{"id":"m3-3.10.10-3","section":"3.10.10","sectionTitle":"Check Your Understanding - Cryptography","question":"Which encryption method uses the same key to encrypt and decrypt data?","choices":["Triple DES","Symmetric","Block Cipher","Data Encryption Standard","Asymmetric"],"correct":["Symmetric"],"multi":false,"explanation":"Symmetric encryption methods use the same key to encrypt and decrypt data."},{"id":"m3-3.10.10-4","section":"3.10.10","sectionTitle":"Check Your Understanding - Cryptography","question":"Which encryption method is a stream cipher and is used to secure web traffic in SSL and TLS?","choices":["Rivest Cipher","Triple DES","Symmetric","Block Cipher","Data Encryption Standard"],"correct":["Rivest Cipher"],"multi":false,"explanation":"The Rivest cipher is a stream cipher used to secure web traffic in SSL and TLS."},{"id":"m3-3.11.3-1","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"The IT department is reporting that a company web server is receiving an abnormally high number of web page requests from different locations simultaneously. Which type of security attack is occurring?","choices":["spyware","phishing","DDoS","social engineering","adware"],"correct":["DDoS"],"multi":false,"explanation":"Topic 3.5.9 — Unlike phishing, spyware, social engineering, or adware, a DDoS attack generates large amounts of traffic from multiple sources to restrict access to network services."},{"id":"m3-3.11.3-2","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What causes a buffer overflow?","choices":["downloading and installing too many software updates at one time","attempting to write more data to a memory location than that location can hold","sending too much information to two or more interfaces of the same device, thereby causing dropped packets","sending repeated connections such as Telnet to a particular device, thus denying other data sources","launching a security countermeasure to mitigate a Trojan horse"],"correct":["attempting to write more data to a memory location than that location can hold"],"multi":false,"explanation":"Topic 3.5.5 — By sending too much data to a specific area of memory, adjacent memory locations are overwritten, causing a security issue in the overwritten memory location."},{"id":"m3-3.11.3-3","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which objective of secure communications is achieved by encrypting data?","choices":["authentication","confidentiality","integrity","availability"],"correct":["confidentiality"],"multi":false,"explanation":"Topic 3.9.1 — When data is encrypted, it is scrambled to keep it private and confidential so that only authorized recipients can read the message."},{"id":"m3-3.11.3-4","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What type of malware has the primary objective of spreading across the network?","choices":["virus","botnet","Trojan horse","worm"],"correct":["worm"],"multi":false,"explanation":"Topic 3.4.3 — The main purpose of a worm is to self-replicate and propagate across the network. A virus needs a user to spread; a Trojan horse disguises itself as a legitimate application; a botnet is zombie computers working together to wage a network attack."},{"id":"m3-3.11.3-5","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which algorithm can ensure data confidentiality?","choices":["MD5","PKI","AES","RSA"],"correct":["AES"],"multi":false,"explanation":"Topic 3.10.6 — Data confidentiality is ensured through symmetric encryption algorithms, including DES, 3DES, and AES."},{"id":"m3-3.11.3-6","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What three items are components of the CIA triad? (Choose three.)","choices":["scalability","access","intervention","confidentiality","integrity","availability"],"correct":["confidentiality","integrity","availability"],"multi":true,"explanation":"Topic 3.9.1 — The CIA triad contains three components: confidentiality, integrity, and availability. It is a guideline for information security for an organization."},{"id":"m3-3.11.3-7","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which cyber attack involves a coordinated attack from a botnet of zombie computers?","choices":["address spoofing","ICMP redirect","DDoS","MITM"],"correct":["DDoS"],"multi":false,"explanation":"Topic 3.5.9 — A DDoS attack is launched from multiple coordinated sources — zombie hosts built into a botnet — that are instructed to attack the chosen target."},{"id":"m3-3.11.3-8","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What specialized network device is responsible for enforcing access control policies between networks?","choices":["firewall","switch","IDS","bridge"],"correct":["firewall"],"multi":false,"explanation":"Topic 3.9.3 — Firewalls are used to permit or block traffic between networks according to access control policies."},{"id":"m3-3.11.3-9","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"To which category of security attacks does man-in-the-middle belong?","choices":["DoS","access","reconnaissance","social engineering"],"correct":["access"],"multi":false,"explanation":"Topic 3.5.5 — With a man-in-the-middle attack, a threat actor is positioned between two legitimate entities to read, modify, or redirect the data that passes between the two parties."},{"id":"m3-3.11.3-10","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is the role of an IPS?","choices":["to detect patterns of malicious traffic by the use of signature files","to enforce access control policies based on packet content","to filter traffic based on defined rules and connection context","to filter traffic based on Layer 7 information"],"correct":["to detect patterns of malicious traffic by the use of signature files"],"multi":false,"explanation":"Topic 3.9.4 — An IPS uses a set of rules called signatures to detect patterns in network traffic."},{"id":"m3-3.11.3-11","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which type of DNS attack involves the cybercriminal compromising a parent domain and creating multiple subdomains to be used during the attacks?","choices":["tunneling","cache poisoning","amplification and reflection","shadowing"],"correct":["shadowing"],"multi":false,"explanation":"Topic 3.8.4 — DNS shadowing attacks compromise a parent domain; the cybercriminal then creates subdomains used in attacks."},{"id":"m3-3.11.3-12","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which two types of hackers are typically classified as grey hat hackers? (Choose two.)","choices":["script kiddies","cyber criminals","vulnerability brokers","state-sponsored hackers","hacktivists"],"correct":["vulnerability brokers","hacktivists"],"multi":true,"explanation":"Topic 3.2.2 — Grey hat hackers do unethical or illegal things but not for personal gain or to cause damage. Hacktivists use hacking as political or social protest; vulnerability brokers hack to uncover weaknesses and report them to vendors."},{"id":"m3-3.11.3-13","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is a significant characteristic of virus malware?","choices":["Virus malware is only distributed over the Internet.","Once installed on a host system, a virus will automatically propagate itself to other systems.","A virus can execute independently of the host system.","A virus is triggered by an event on the host system."],"correct":["A virus is triggered by an event on the host system."],"multi":false,"explanation":"Topic 3.4.2 — A virus requires specific activation — user actions or a time-based event. Self-propagation is a feature of worms, not viruses."},{"id":"m3-3.11.3-14","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"A cleaner attempts to enter a computer lab but is denied entry because there is no scheduled cleaning for that day. What type of attack was just prevented?","choices":["phishing","shoulder surfing","war driving","social engineering","Trojan"],"correct":["social engineering"],"multi":false,"explanation":"Topic 3.5.6 — Social engineering is when a person attempts to manipulate another individual to gain access to information or resources to which they are not entitled."},{"id":"m3-3.11.3-15","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which network security statement is true?","choices":["All threats come from external networks.","Internal threats are always accidental.","Internal threats are always intentional.","Internal threats can cause greater damage than external threats."],"correct":["Internal threats can cause greater damage than external threats."],"multi":false,"explanation":"Topic 3.1.2 — Internal threats can be intentional or accidental and can cause greater damage than external threats because an internal user has direct access to the internal corporate network and corporate data."},{"id":"m3-3.11.3-16","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What commonly motivates cybercriminals to attack networks as compared to hacktivists or state-sponsored hackers?","choices":["Fame seeking","Financial gain","Political reasons","Status among peers"],"correct":["Financial gain"],"multi":false,"explanation":"Topic 3.2.3 — Cybercriminals are commonly motivated by money. Hackers hack for status. Cyberterrorists are motivated by religious or political reasons."},{"id":"m3-3.11.3-17","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which type of hacker is motivated by protesting political and social issues?","choices":["Cybercriminal","Hacktivist","Script kiddie","Vulnerability broker"],"correct":["Hacktivist"],"multi":false,"explanation":"Topic 3.2.4 — Hacktivists are motivated by protesting political and social issues."},{"id":"m3-3.11.3-18","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is Trojan horse malware?","choices":["It is malware that can only be distributed over the internet.","It is software that appears useful but includes malicious code.","It is software that causes annoying computer problems.","It is the most easily detected form of malware."],"correct":["It is software that appears useful but includes malicious code."],"multi":false,"explanation":"Topic 3.4.2 — Trojan horse malware appears as useful software but hides malicious code. Some targeted Trojan horses can be among the most difficult malware to detect."},{"id":"m3-3.11.3-19","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"A user receives a call from someone in IT services, asking her to confirm her username and password for auditing purposes. Which security threat does this represent?","choices":["Anonymous keylogging","DDoS","Social engineering","Spam"],"correct":["Social engineering"],"multi":false,"explanation":"Topic 3.5.6 — Social engineering involves attempting to gain the confidence of an employee to divulge confidential information such as usernames and passwords."},{"id":"m3-3.11.3-20","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is a ping sweep?","choices":["A DNS query and response protocol","A network scanning technique that involves identifying active IP addresses","A type of packet capturing software","A TCP and UDP port scanner to detect open services"],"correct":["A network scanning technique that involves identifying active IP addresses"],"multi":false,"explanation":"Topic 3.5.3 — A ping sweep is a reconnaissance technique used to locate live IP addresses, usually in preparation for another type of network attack."},{"id":"m3-3.11.3-21","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"How are zombies used in security attacks?","choices":["Zombies are infected machines that carry out a DDoS attack.","Zombies are maliciously formed code segments used to replace legitimate applications.","Zombies probe a group of machines for open ports to learn which services are running.","Zombies target specific individuals to gain corporate or personal information."],"correct":["Zombies are infected machines that carry out a DDoS attack."],"multi":false,"explanation":"Topic 3.5.9 — Zombies are infected computers that make up a botnet. They are used to deploy a distributed denial-of-service (DDoS) attack."},{"id":"m3-3.11.3-22","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is used to decrypt data that has been encrypted using an asymmetric encryption algorithm public key?","choices":["A different public key","A digital certificate","A private key","DH"],"correct":["A private key"],"multi":false,"explanation":"Topic 3.10.8 — When an asymmetric algorithm is used, either key can encrypt, but the complementary matched key must decrypt. If the public key encrypts, the private key must decrypt."},{"id":"m3-3.11.3-23","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What are the SHA hash generating algorithms used for?","choices":["Authentication","Confidentiality","Integrity","Nonrepudiation"],"correct":["Integrity"],"multi":false,"explanation":"Topic 3.9.1 — Integrity is ensured by implementing SHA hash generating algorithms. Data confidentiality uses symmetric encryption algorithms including 3DES and AES."},{"id":"m3-3.11.3-24","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which of the following is true of an IPS?","choices":["It can stop malicious packets.","It has no impact on latency.","It is deployed in offline mode.","It is primarily focused on identifying possible incidents."],"correct":["It can stop malicious packets."],"multi":false,"explanation":"Topic 3.9.4 — An IPS can identify and stop malicious packets. Because it is deployed inline, it can add latency to the network."},{"id":"m3-3.11.3-25","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is the term used to describe unethical criminals who compromise computer and network security for personal gain or for malicious reasons?","choices":["Black hat hackers","Hacktivists","Script kiddies","Vulnerability broker"],"correct":["Black hat hackers"],"multi":false,"explanation":"Topic 3.2.1 — Black hat hackers are unethical threat actors who compromise security vulnerabilities for financial or personal gain, or with malicious intent."},{"id":"m3-3.11.3-26","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What is the term used to describe a potential danger to a company's assets, data, or network functionality?","choices":["Asymmetric encryption algorithm","Exploit","Threat","Vulnerability"],"correct":["Threat"],"multi":false,"explanation":"Topic 3.1.1 — A threat is a potential danger to assets, data, or network functionality. An exploit takes advantage of a vulnerability; a vulnerability is a weakness that could be exploited."},{"id":"m3-3.11.3-27","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What term is used to describe a guarantee that a message is not a forgery and does actually come from the person who is supposed to have sent it?","choices":["Data nonrepudiation","Exploit","Mitigation","Origin authentication"],"correct":["Origin authentication"],"multi":false,"explanation":"Topic 3.10.2 — Origin authentication guarantees that a message is not a forgery. Data nonrepudiation guarantees that the sender cannot refute the validity of a message sent."},{"id":"m3-3.11.3-28","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"What term is used to describe a mechanism that takes advantage of a vulnerability?","choices":["Asymmetric encryption algorithm","Exploit","Threat","Vulnerability"],"correct":["Exploit"],"multi":false,"explanation":"Topic 3.1.1 — An exploit is a mechanism that takes advantage of a vulnerability. A threat is a potential danger; a vulnerability is a weakness that could be exploited."},{"id":"m3-3.11.3-29","section":"3.11.3","sectionTitle":"Module Quiz - Network Security Concepts","question":"Which of the following guarantees that the sender cannot repudiate, or refute, the validity of a message sent?","choices":["Data nonrepudiation","Exploit","Mitigation","Origin authentication"],"correct":["Data nonrepudiation"],"multi":false,"explanation":"Topic 3.10.2 — Data nonrepudiation guarantees that the sender cannot repudiate the validity of a message sent. Origin authentication guarantees a message is not a forgery. Mitigation is a countermeasure to reduce a threat or risk."}], "module4": [{"id":"m4-4.1.5-1","section":"4.1.5","sectionTitle":"Check Your Understanding - Purpose of ACLs","question":"What are the permit or deny statements in an ACL called?","choices":["access control entries","arbitrary statements","content control entries","control statements"],"correct":["access control entries"],"multi":false,"explanation":"The sequential list of permit and deny statements in an ACL are called access control entries (ACEs)."},{"id":"m4-4.1.5-2","section":"4.1.5","sectionTitle":"Check Your Understanding - Purpose of ACLs","question":"Which packet filtering statement is true?","choices":["Extended ACLs filter at Layer 3 only.","Extended ACLs filter at Layer 4 only.","Standard ACLs filter at Layer 3 only.","Standard ACLs filter at Layer 4 only."],"correct":["Standard ACLs filter at Layer 3 only."],"multi":false,"explanation":"Standard ACLs filter at Layer 3 only."},{"id":"m4-4.1.5-3","section":"4.1.5","sectionTitle":"Check Your Understanding - Purpose of ACLs","question":"Which statement about the operation of a standard ACL is incorrect?","choices":["The router extracts the source IPv4 address from the packet header.","The router starts at the top of the ACL and compares the address to each ACE in sequential order.","When a match is made, the ACE either permits or denies the packet, and any remaining ACEs are not analyzed.","If there are no matching ACEs in the ACL, the packet is forwarded because there is an implicit permit ACE automatically applied to all ACLs."],"correct":["If there are no matching ACEs in the ACL, the packet is forwarded because there is an implicit permit ACE automatically applied to all ACLs."],"multi":false,"explanation":"If there is no matching ACE in the ACL, the packet is discarded because of the implicit deny ACE automatically applied to all ACLs."},{"id":"m4-4.2.5-1","section":"4.2.5","sectionTitle":"Check Your Understanding - Wildcard Masks in ACLs","question":"Which wildcard mask would permit only host 10.10.10.1?","choices":["0.0.0.0","0.0.0.31","0.0.0.255","0.0.255.255","255.255.255.255"],"correct":["0.0.0.0"],"multi":false,"explanation":"The wildcard mask that would permit only host 10.10.10.1 is 0.0.0.0."},{"id":"m4-4.2.5-2","section":"4.2.5","sectionTitle":"Check Your Understanding - Wildcard Masks in ACLs","question":"Which wildcard mask would permit only hosts from the 10.10.0.0/16 network?","choices":["0.0.0.0","0.0.0.31","0.0.0.255","0.0.255.255","255.255.255.255"],"correct":["0.0.255.255"],"multi":false,"explanation":"The wildcard mask that would permit only hosts from the 10.10.0.0/16 network is 0.0.255.255."},{"id":"m4-4.2.5-3","section":"4.2.5","sectionTitle":"Check Your Understanding - Wildcard Masks in ACLs","question":"Which wildcard mask would permit all hosts?","choices":["0.0.0.0","0.0.0.31","0.0.0.255","0.0.255.255","255.255.255.255"],"correct":["255.255.255.255"],"multi":false,"explanation":"The wildcard mask that would permit all hosts is 255.255.255.255."},{"id":"m4-4.2.5-4","section":"4.2.5","sectionTitle":"Check Your Understanding - Wildcard Masks in ACLs","question":"Which wildcard mask would permit all hosts from the 192.168.10.0/24 network?","choices":["0.0.0.0","0.0.0.31","0.0.0.255","0.0.255.255","255.255.255.255"],"correct":["0.0.0.255"],"multi":false,"explanation":"The wildcard mask that would permit all hosts from the 192.168.10.0/24 network is 0.0.0.255."},{"id":"m4-4.3.3-1","section":"4.3.3","sectionTitle":"Check Your Understanding - Guidelines for ACL Creation","question":"How many total ACLs (both IPv4 and IPv6) can be configured on an interface?","choices":["0","1","2","4","8"],"correct":["4"],"multi":false,"explanation":"Four ACLs — two IPv4 and two IPv6 — can be configured per interface."},{"id":"m4-4.3.3-2","section":"4.3.3","sectionTitle":"Check Your Understanding - Guidelines for ACL Creation","question":"Which of the following is an ACL best practice?","choices":["Always test ACLs on a production network.","Create your ACLs on a production router.","Document the ACLs using the description ACL command.","Write the ACL before configuring it on a router."],"correct":["Write the ACL before configuring it on a router."],"multi":false,"explanation":"A best practice is to write out what you want an ACL to do before configuring the ACL."},{"id":"m4-4.4.6-1","section":"4.4.6","sectionTitle":"Check Your Understanding - Types of IPv4 ACLs","question":"Which ACL is capable of filtering based on TCP port number?","choices":["extended ACL","standard ACL"],"correct":["extended ACL"],"multi":false,"explanation":"A standard ACL filters on source IPv4 addresses. An extended ACL filters on source and destination IPv4 address, protocol, and TCP/UDP ports."},{"id":"m4-4.4.6-2","section":"4.4.6","sectionTitle":"Check Your Understanding - Types of IPv4 ACLs","question":"Which statement about ACLs is true?","choices":["Extended ACLs are numbered 1300 - 2699.","Named ACLs can be standard or extended.","Numbered ACLs is the preferred method to use when configuring ACLs.","Standard ACLs are numbered 1 - 199."],"correct":["Named ACLs can be standard or extended."],"multi":false,"explanation":"Named ACLs can be standard or extended."},{"id":"m4-4.4.6-3","section":"4.4.6","sectionTitle":"Check Your Understanding - Types of IPv4 ACLs","question":"Where should a standard ACL be placed?","choices":["Standard ACL location is not important.","Standard ACLs should be placed as close to the destination as possible.","Standard ACLs should be placed as close to the source as possible.","Standard ACLs should be placed on serial interfaces."],"correct":["Standard ACLs should be placed as close to the destination as possible."],"multi":false,"explanation":"Standard ACLs should be located as close to the destination as possible."},{"id":"m4-4.4.6-4","section":"4.4.6","sectionTitle":"Check Your Understanding - Types of IPv4 ACLs","question":"Where should an extended ACL be placed?","choices":["Extended ACL location is not important.","Extended ACLs should be located as close to the destination as possible.","Extended ACLs should be located as close to the source as possible.","Extended ACLs should be located on serial interfaces."],"correct":["Extended ACLs should be located as close to the source as possible."],"multi":false,"explanation":"Extended ACLs should be located as close to the source as possible."},{"id":"m4-4.5.2-1","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which two conditions would cause a router to drop a packet? (Choose two.)","choices":["The ACL that is affecting the packet does not contain at least one deny ACE.","No routing table entry exists for the packet destination, but the packet matches a permitted address in an outbound ACL.","No outbound ACL exists on the interface where the packet exits the router.","No inbound ACL exists on the interface where the packet enters the router.","The packet source address does not match the source as permitted in a standard inbound ACE."],"correct":["No routing table entry exists for the packet destination, but the packet matches a permitted address in an outbound ACL.","The packet source address does not match the source as permitted in a standard inbound ACE."],"multi":true,"explanation":"Topic 4.1.1 — Routers drop packets with no routing table destination. If an ACL exists and the source IP does not match a permitted entry, the packet is dropped. ACLs contain an implicit deny ACE at the end."},{"id":"m4-4.5.2-2","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"A network administrator configures an ACL with the command: access-list 1 permit 172.16.0.0 0.0.15.255. Which two IP addresses will match this ACL statement? (Choose two.)","choices":["172.16.16.12","172.16.31.24","172.16.65.21","172.16.0.255","172.16.15.36"],"correct":["172.16.0.255","172.16.15.36"],"multi":true,"explanation":"Topic 4.2.2 — The wildcard mask 0.0.15.255 means any IP address within the range 172.16.0.0 to 172.16.15.255 matches."},{"id":"m4-4.5.2-3","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which two statements describe appropriate general guidelines for configuring and applying ACLs? (Choose two.)","choices":["Multiple ACLs per protocol and per direction can be applied to an interface.","If a single ACL is to be applied to multiple interfaces, it must be configured with a unique number for each interface.","The most specific ACL statements should be entered first because of the top-down sequential nature of ACLs.","If an ACL contains no permit statements, all traffic is denied by default.","Standard ACLs are placed closest to the source, whereas extended ACLs are placed closest to the destination."],"correct":["The most specific ACL statements should be entered first because of the top-down sequential nature of ACLs.","If an ACL contains no permit statements, all traffic is denied by default."],"multi":true,"explanation":"Topic 4.1.3 — An interface can only have one ACL per direction. Standard ACLs filter only on source address so they are placed closest to the destination. Extended ACLs are placed closest to the source. A single ACL can be applied to multiple interfaces."},{"id":"m4-4.5.2-4","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"What single access list statement matches all of the following networks: 192.168.16.0, 192.168.17.0, 192.168.18.0, 192.168.19.0?","choices":["access-list 10 permit 192.168.16.0 0.0.3.255","access-list 10 permit 192.168.0.0 0.0.15.255","access-list 10 permit 192.168.16.0 0.0.0.255","access-list 10 permit 192.168.16.0 0.0.15.255"],"correct":["access-list 10 permit 192.168.16.0 0.0.3.255"],"multi":false,"explanation":"Topic 4.2.2 — All four prefixes share the same 22 high order bits, matched by the network prefix and wildcard mask 192.168.16.0 0.0.3.255."},{"id":"m4-4.5.2-5","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which three statements describe ACL processing of packets? (Choose three.)","choices":["A packet can either be rejected or forwarded as directed by the ACE that is matched.","A packet that does not match the conditions of any ACE will be forwarded by default.","Each statement is checked only until a match is detected or until the end of the ACE list.","Each packet is compared to the conditions of every ACE in the ACL before a forwarding decision is made.","An implicit deny any rejects any packet that does not match any ACE.","A packet that has been denied by one ACE can be permitted by a subsequent ACE."],"correct":["A packet can either be rejected or forwarded as directed by the ACE that is matched.","Each statement is checked only until a match is detected or until the end of the ACE list.","An implicit deny any rejects any packet that does not match any ACE."],"multi":true,"explanation":"Topic 4.1.3 — The router checks each ACE in order; once a match is found the action is taken and remaining ACEs are skipped. An implicit deny any is at the end of every ACL."},{"id":"m4-4.5.2-6","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"A network administrator is configuring an ACL to restrict access to certain servers in the data center. The ACL is incorrectly applied to an interface in the inbound direction instead of the outbound direction. What happens?","choices":["All traffic is denied.","All traffic is permitted.","The ACL does not perform as designed.","The ACL will analyze traffic after it is routed to the outbound interface."],"correct":["The ACL does not perform as designed."],"multi":false,"explanation":"Topic 4.1.3 — Always test an ACL to ensure that it performs as designed. Applying an ACL in the wrong direction will not work as designed."},{"id":"m4-4.5.2-7","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which scenario would cause an ACL misconfiguration and deny all traffic?","choices":["Apply a standard ACL using the ip access-group out command.","Apply a named ACL to a VTY line.","Apply an ACL that has all deny ACE statements.","Apply a standard ACL in the inbound direction."],"correct":["Apply an ACL that has all deny ACE statements."],"multi":false,"explanation":"Topic 4.1.3 — Having all ACEs with deny statements denies all traffic because there is an implicit deny any command at the end of every standard ACL."},{"id":"m4-4.5.2-8","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"In applying an ACL to a router interface, which traffic is designated as outbound?","choices":["traffic that is leaving the router and going toward the destination host","traffic that is coming from the source IP address into the router","traffic for which the router can find no routing table entry","traffic that is going from the destination IP address into the router"],"correct":["traffic that is leaving the router and going toward the destination host"],"multi":false,"explanation":"Topic 4.1.3 — Outbound traffic is interpreted from the router's perspective: packets leaving the router interface toward the destination."},{"id":"m4-4.5.2-9","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"When creating an ACL, which keyword should be used to document and interpret the purpose of the ACL statement on a Cisco device?","choices":["remark","description","established","eq"],"correct":["remark"],"multi":false,"explanation":"Topic 4.3.2 — The remark keyword is used to document the purpose of an ACL. The description keyword is used for interfaces, not ACLs."},{"id":"m4-4.5.2-10","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which location is recommended for extended numbered or extended named ACLs?","choices":["a location as close to the destination of traffic as possible","a location as close to the source of traffic as possible","a location centered between traffic destinations and sources to filter as much traffic as possible","if using the established keyword, a location close to the destination to ensure that return traffic is allowed"],"correct":["a location as close to the source of traffic as possible"],"multi":false,"explanation":"Topic 4.4.3 — Extended ACLs are normally placed as close to the source as possible. Standard ACLs are placed as close to the destination as possible."},{"id":"m4-4.5.2-11","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which range represents all the IP addresses that are affected when network 10.120.160.0 with a wildcard mask of 0.0.7.255 is used in an ACE?","choices":["10.120.160.0 to 10.120.167.255","10.120.160.0 to 10.127.255.255","10.120.160.0 to 10.120.191.255","10.120.160.0 to 10.120.168.0"],"correct":["10.120.160.0 to 10.120.167.255"],"multi":false,"explanation":"Topic 4.2.2 — A wildcard mask of 0.0.7.255 means the first 5 bits of the 3rd octet are fixed; the last 3 bits range from 000 to 111 (160–167), and the last octet ranges from 0 to 255."},{"id":"m4-4.5.2-12","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"A college student is studying extended access lists. Which three keywords could immediately follow the keywords permit or deny as part of an extended access list? (Choose three.)","choices":["telnet","tcp","udp","www","icmp","ftp"],"correct":["tcp","udp","icmp"],"multi":true,"explanation":"Topic 4.4.1 — Four commonly used keywords following permit or deny in an extended ACL are ip, tcp, udp, and icmp."},{"id":"m4-4.5.2-13","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"If the provided ACEs are in the same ACL, which ACE should be listed first in the ACL according to best practice?","choices":["permit tcp 172.16.0.0 0.0.3.255 any established","deny tcp any any eq telnet","deny udp any host 172.16.1.5 eq snmptrap","permit udp any any range 10000 20000","permit udp 172.16.0.0 0.0.255.255 host 172.16.1.5 eq snmptrap","permit ip any any"],"correct":["permit udp 172.16.0.0 0.0.255.255 host 172.16.1.5 eq snmptrap"],"multi":false,"explanation":"Topic 4.1.3 — Best practice places the most specific ACE first. The SNMP trap statement is more specific than the broad UDP range statement and should come first."},{"id":"m4-4.5.2-14","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which operator is used in an ACL statement to match packets of a specific application?","choices":["established","lt","eq","gt"],"correct":["eq"],"multi":false,"explanation":"Topic 4.4.1 — The eq operator matches a specific port/service number, such as eq 21 for FTP."},{"id":"m4-4.5.2-15","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"What two functions describe uses of access control lists? (Choose two.)","choices":["ACLs assist a router in determining the best path to a destination.","ACLs can control which areas a host can access on a network.","ACLs provide a basic level of security for network access.","Standard ACLs can filter traffic based on source and destination network addresses.","Standard ACLs can restrict access to specific applications and ports."],"correct":["ACLs can control which areas a host can access on a network.","ACLs provide a basic level of security for network access."],"multi":true,"explanation":"Topic 4.1.1 — ACLs act as a simple firewall providing basic traffic filtering and can control which network areas a host can access."},{"id":"m4-4.5.2-16","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which three statements describe how an ACL processes packets? (Choose three.)","choices":["A packet is compared with all ACEs in the ACL before a forwarding decision is made.","A packet that has been denied by one ACE can be permitted by a subsequent ACE.","An implicit deny at the end of an ACL rejects any packet that does not match an ACE.","Each ACE is checked only until a match is detected or until the end of the ACL.","If an ACE is matched, the packet is either rejected or forwarded, as directed by the ACE.","If an ACE is not matched, the packet is forwarded by default."],"correct":["An implicit deny at the end of an ACL rejects any packet that does not match an ACE.","Each ACE is checked only until a match is detected or until the end of the ACL.","If an ACE is matched, the packet is either rejected or forwarded, as directed by the ACE."],"multi":true,"explanation":"Topic 4.1.3 — Once a match is found the remaining ACEs are skipped. An implicit deny any is always at the end of every ACL."},{"id":"m4-4.5.2-17","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which three statements are best practices related to placement of ACLs? (Choose three.)","choices":["Filter unwanted traffic before it travels onto a low-bandwidth link.","For every inbound ACL placed on an interface, ensure that there is a matching outbound ACL.","Place extended ACLs close to the destination IP address of the traffic.","Place extended ACLs close to the source IP address of the traffic.","Place standard ACLs close to the destination IP address of the traffic.","Place standard ACLs close to the source IP address of the traffic."],"correct":["Filter unwanted traffic before it travels onto a low-bandwidth link.","Place extended ACLs close to the source IP address of the traffic.","Place standard ACLs close to the destination IP address of the traffic."],"multi":true,"explanation":"Topic 4.4.3 — Extended ACLs go near the source to avoid wasting bandwidth. Standard ACLs (source-only filter) go near the destination to avoid blocking too much traffic."},{"id":"m4-4.5.2-18","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which two characteristics are shared by standard and extended ACLs? (Choose two.)","choices":["Both filter packets for a specific destination host IP address.","Both include an implicit deny as a final entry.","Both permit or deny specific services by port number.","They both filter based on protocol type.","They can be created by using either descriptive names or numbers."],"correct":["Both include an implicit deny as a final entry.","They can be created by using either descriptive names or numbers."],"multi":true,"explanation":"Topic 4.4.1 — Both standard and extended ACLs contain an implicit deny as a final ACE and can be identified by names or numbers."},{"id":"m4-4.5.2-19","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"Which two statements describe a difference between the operation of inbound and outbound ACLs? (Choose two.)","choices":["Inbound ACLs are processed before the packets are routed.","Inbound ACLs can be used in both routers and switches.","Multiple inbound ACLs can be applied to an interface.","Multiple outbound ACLs can be applied to an interface.","Outbound ACLs are processed after the routing is completed.","Outbound ACLs can be used only on routers.","Unlike outbound ACLs, inbound ACLs can be used to filter packets with multiple criteria."],"correct":["Inbound ACLs are processed before the packets are routed.","Outbound ACLs are processed after the routing is completed."],"multi":true,"explanation":"Topic 4.1.3 — With an inbound ACL, packets are processed before routing. With an outbound ACL, packets are first routed to the outbound interface, then processed."},{"id":"m4-4.5.2-20","section":"4.5.2","sectionTitle":"Module Quiz - ACL Concepts","question":"In which configuration would an outbound
