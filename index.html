<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSPF Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7fa;
  --line: #dfe7f1;
  --surface: #ffffff;
  --surface-soft: #f7f9fc;
  --text: #313b4c;
  --text-muted: #76839a;
  --text-faint: #a4aec1;
  --accent: #7c8fe0;
  --accent-deep: #5f6fc9;
  --accent-soft: #edf0fc;
  --accent-2: #6fbf9b;
  --accent-2-soft: #e6f6ef;
  --success: #4fa980;
  --success-soft: #e7f6ef;
  --success-line: #bfe4d3;
  --error: #d97b73;
  --error-soft: #fbeae8;
  --error-line: #f0c7c2;
  --shadow-sm: 0 2px 10px -4px rgba(49, 59, 76, 0.12);
  --shadow-md: 0 14px 34px -16px rgba(49, 59, 76, 0.22);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 4px 4px, var(--line) 1.6px, transparent 1.7px);
  background-size: 42px 42px;
  color: var(--text);
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .heading-font {
  font-family: 'Quicksand', 'Nunito', sans-serif;
  font-weight: 700;
  margin: 0;
  color: var(--text);
}

button {
  font-family: inherit;
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 20px 64px;
}

@media (max-width: 480px) {
  .wrap {
    padding: 28px 16px 48px;
  }
}

/* ---------- focus ---------- */
a:focus-visible,
button:focus-visible,
input:focus-visible + label,
.choice:focus-within {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- buttons ---------- */
.btn {
  border: none;
  border-radius: var(--radius-pill);
  padding: 13px 26px;
  font-weight: 700;
  font-size: 15.5px;
  font-family: 'Quicksand', sans-serif;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
  letter-spacing: 0.01em;
  margin-top: 20px;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-deep);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-primary:disabled {
  background: #c9cfe8;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  padding: 10px 16px;
}

.btn-ghost:hover {
  color: var(--accent-deep);
}

.btn-outline {
  background: var(--surface);
  color: var(--accent-deep);
  border: 1.5px solid var(--accent-soft);
  box-shadow: var(--shadow-sm);
}

.btn-outline:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.btn-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 26px;
}

/* ---------- header ---------- */
.page-header {
  margin-bottom: 30px;
}

.page-header h1 {
  font-size: 30px;
  letter-spacing: 0.01em;
}

.page-header p {
  margin: 8px 0 0;
  color: var(--text-muted);
  font-size: 15.5px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}

.topbar .module-name {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--text-muted);
}

/* ---------- progress ---------- */
.progress-track {
  height: 8px;
  background: var(--accent-soft);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: var(--radius-pill);
  transition: width 0.35s ease;
}

.progress-label {
  font-size: 13.5px;
  color: var(--text-faint);
  margin-bottom: 24px;
}

.score-live {
  display: inline-block;
  float: right;
  font-size: 13.5px;
  font-weight: 700;
  font-family: 'Quicksand', sans-serif;
  color: var(--accent-deep);
}

/* ---------- resume card ---------- */
.resume-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: var(--accent-soft);
  border: 1.5px solid #dce1f7;
  border-radius: var(--radius-lg);
  padding: 18px 22px;
  margin-bottom: 22px;
}

.resume-card .resume-text {
  min-width: 0;
}

.resume-card .resume-label {
  font-size: 12.5px;
  text-transform: none;
  color: var(--accent-deep);
  font-weight: 700;
  font-family: 'Quicksand', sans-serif;
  margin-bottom: 3px;
}

.resume-card .resume-detail {
  font-size: 14.5px;
  color: var(--text-muted);
}

/* ---------- module tiles ---------- */
.module-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.module-tile {
  display: flex;
  align-items: center;
  gap: 18px;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: none;
  border-left: 5px solid var(--tile-accent, var(--accent));
  border-radius: var(--radius-md);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.module-tile:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.module-tile .num {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 26px;
  color: var(--tile-accent, var(--accent));
  background: var(--tile-accent-soft, var(--accent-soft));
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.module-tile .info {
  min-width: 0;
  flex: 1;
}

.module-tile .info .title {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 3px;
}

.module-tile .info .subtitle {
  font-size: 14px;
  color: var(--text-muted);
}

.module-tile .count {
  font-size: 12.5px;
  color: var(--text-muted);
  background: var(--surface-soft);
  border-radius: var(--radius-pill);
  padding: 5px 12px;
  white-space: nowrap;
  font-weight: 600;
}

.module-tile .best-score {
  font-size: 12px;
  color: var(--accent-2);
  font-weight: 700;
  margin-top: 4px;
  white-space: nowrap;
}

.menu-footnote {
  margin-top: 26px;
  font-size: 13.5px;
  color: var(--text-faint);
  text-align: center;
}

/* ---------- checkpoint tile ---------- */
.menu-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  color: var(--text-faint);
  font-size: 12px;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.menu-divider::before,
.menu-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.checkpoint-tile {
  border-left-style: solid;
}
.checkpoint-tile .num {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0;
}

/* ---------- quiz card ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 26px 26px 24px;
  box-shadow: var(--shadow-sm);
}

@media (max-width: 480px) {
  .card {
    padding: 20px 18px;
  }
}

.section-tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Quicksand', sans-serif;
  color: var(--accent-deep);
  background: var(--accent-soft);
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  margin-bottom: 14px;
}

.question-text {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.45;
  margin-bottom: 6px;
}

.multi-hint {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 18px;
}

.choice {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1.5px solid #e7ebf3;
  background: var(--surface-soft);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  cursor: pointer;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.choice:hover {
  border-color: var(--accent);
}

.choice input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.choice .mark {
  width: 21px;
  height: 21px;
  min-width: 21px;
  border-radius: 50%;
  border: 2px solid #c7cfe4;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

.choice.multi .mark {
  border-radius: 6px;
}

.choice .mark::after {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.choice.multi .mark::after {
  width: 12px;
  height: 7px;
  border-radius: 1px;
  background: transparent;
  border-left: 2.5px solid #fff;
  border-bottom: 2.5px solid #fff;
  transform: rotate(-45deg) scale(0.6) translateY(-1px);
}

.choice input:checked + .mark {
  border-color: var(--accent);
  background: var(--accent);
}

.choice.multi input:checked + .mark {
  background: var(--accent);
}

.choice input:checked + .mark::after {
  opacity: 1;
  transform: scale(1);
}

.choice.multi input:checked + .mark::after {
  opacity: 1;
  transform: rotate(-45deg) scale(1) translateY(-1px);
}

.choice .choice-text {
  font-size: 15.5px;
  line-height: 1.4;
}

.choice input:disabled ~ .choice-text {
  color: var(--text);
}

.choice.disabled {
  cursor: default;
}

.choice.is-correct {
  border-color: var(--success-line);
  background: var(--success-soft);
}

.choice.is-correct .mark {
  border-color: var(--success);
}

.choice.is-correct .mark::after {
  background: var(--success);
  opacity: 1;
  transform: scale(1);
}

.choice.is-correct.multi .mark::after {
  background: transparent;
}

.choice.is-wrong {
  border-color: var(--error-line);
  background: var(--error-soft);
}

.choice.is-wrong .mark {
  border-color: var(--error);
}

.choice.is-wrong .mark::after {
  background: var(--error);
}

.choice.is-wrong.multi .mark::after {
  background: transparent;
  border-color: #fff;
}

/* ---------- feedback ---------- */
.feedback {
  margin-top: 20px;
  border-radius: var(--radius-md);
  padding: 16px 18px;
}

.feedback.correct {
  background: var(--success-soft);
  border: 1.5px solid var(--success-line);
}

.feedback.wrong {
  background: var(--error-soft);
  border: 1.5px solid var(--error-line);
}

.feedback .verdict {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 15.5px;
  margin-bottom: 6px;
}

.feedback.correct .verdict {
  color: var(--success);
}

.feedback.wrong .verdict {
  color: var(--error);
}

.feedback .explain {
  font-size: 14.5px;
  color: var(--text);
  line-height: 1.5;
}

/* ---------- results ---------- */
.score-block {
  text-align: center;
  padding: 10px 0 6px;
}

.score-num {
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 52px;
  color: var(--accent-deep);
  line-height: 1;
}

.score-sub {
  color: var(--text-muted);
  margin-top: 8px;
  font-size: 15.5px;
}

.score-msg {
  margin-top: 14px;
  font-size: 16px;
  font-weight: 600;
}

.review-heading {
  margin-top: 34px;
  margin-bottom: 12px;
  font-size: 15px;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  color: var(--text-muted);
}

.review-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.review-item {
  background: var(--surface);
  border: 1.5px solid #eceff6;
  border-left: 4px solid var(--error);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
}

.review-item .rq {
  font-size: 14.5px;
  font-weight: 600;
  margin-bottom: 8px;
}

.review-item .ra {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.review-item .ra b {
  color: var(--text);
  font-weight: 700;
}

.review-item .ra.right b {
  color: var(--success);
}

.review-item .ra.wrong b {
  color: var(--error);
}

.all-correct {
  text-align: center;
  color: var(--text-muted);
  font-size: 14.5px;
  margin-top: 30px;
}

</style>
</head>

<script>
(function () {
  "use strict";

  var CHECKPOINT_DATA = [{"id":"cp-1","section":"Checkpoint","question":"What is a function of OSPF hello packets?","choices":["to send specifically requested link-state records","to discover neighbors and build adjacencies between them","to ensure database synchronization between routers","to request specific link-state records from neighbor routers"],"correct":["to discover neighbors and build adjacencies between them"],"multi":false,"explanation":"Topic 1.2.4"},{"id":"cp-2","section":"Checkpoint","question":"Which OSPF packet contains the different types of link-state advertisements?","choices":["hello","DBD","LSR","LSU","LSAck"],"correct":["LSU"],"multi":false,"explanation":"Topic 1.2.3"},{"id":"cp-3","section":"Checkpoint","question":"Which three statements describe features of the OSPF topology table? (Choose three.)","choices":["It is a link-state database that represents the network topology.","Its contents are the result of running the SPF algorithm.","When converged, all routers in an area have identical topology tables.","The topology table contains feasible successor routes.","The table can be viewed via the show ip ospf database command.","After convergence, the table only contains the lowest cost route entries for all known networks."],"correct":["It is a link-state database that represents the network topology.","When converged, all routers in an area have identical topology tables.","The table can be viewed via the show ip ospf database command."],"multi":true,"explanation":"Topic 1.1.2 — The topology table on an OSPF router is a link-state database (LSDB) that lists information about all other routers in the network and represents the network topology. All routers within an area have identical link-state databases, and the table can be viewed using the show ip ospf database command. The EIGRP topology table contains feasible successor routes; this concept is not used by OSPF. The SPF algorithm uses the LSDB to produce the routing table."},{"id":"cp-4","section":"Checkpoint","question":"What does an OSPF area contain?","choices":["routers that share the same router ID","routers whose SPF trees are identical","routers that have the same link-state information in their LSDBs","routers that share the same process ID"],"correct":["routers that have the same link-state information in their LSDBs"],"multi":false,"explanation":"Topic 1.1.4 — An OSPF area contains one set of link-state information. OSPF process IDs are locally significant and router IDs uniquely identify each router."},{"id":"cp-5","section":"Checkpoint","question":"What is used to facilitate hierarchical routing in OSPF?","choices":["the use of multiple areas","frequent SPF calculations","autosummarization","the election of designated routers"],"correct":["the use of multiple areas"],"multi":false,"explanation":"Topic 1.1.4 — OSPF supports the concept of areas to prevent larger routing tables, excessive SPF calculations, and large LSDBs."},{"id":"cp-6","section":"Checkpoint","question":"Which OSPF data structure is identical on all OSPF routers that share the same area?","choices":["forwarding database","link-state database","adjacency database","routing table"],"correct":["link-state database"],"multi":false,"explanation":"Topic 1.1.2 — The link-state database lists information about all other routers within an area and is identical across all OSPF routers participating in that area."},{"id":"cp-7","section":"Checkpoint","question":"Which step does an OSPF-enabled router take immediately after establishing an adjacency with another router?","choices":["builds the topology table","exchanges link-state advertisements","chooses the best path","executes the SPF algorithm"],"correct":["exchanges link-state advertisements"],"multi":false,"explanation":"Topic 1.1.3 — The OSPF operation steps are: 1. Establish neighbor adjacencies, 2. Exchange link-state advertisements, 3. Build the topology table, 4. Execute the SPF algorithm, 5. Choose the best route."},{"id":"cp-8","section":"Checkpoint","question":"A network engineer has manually configured the hello interval to 15 seconds on an interface of a router that is running OSPFv2. By default, how will the dead interval on the interface be affected?","choices":["The dead interval will not change from the default value.","The dead interval will now be 30 seconds.","The dead interval will now be 60 seconds.","The dead interval will now be 15 seconds."],"correct":["The dead interval will now be 60 seconds."],"multi":false,"explanation":"Topic 2.4.9 — Cisco IOS automatically modifies the dead interval to four times the hello interval."},{"id":"cp-9","section":"Checkpoint","question":"A network administrator has configured OSPF timers so that R1 has a dead interval of 20 seconds and R2 sends hello packets every 25 seconds. What is the result?","choices":["R1 automatically adjusts its own timers to match the R2 timers.","The R1 dead timer expires between hello packets from R2.","The hello timer on R2 expires every ten seconds.","The neighbor adjacency has formed."],"correct":["The R1 dead timer expires between hello packets from R2."],"multi":false,"explanation":"Topic 2.4.9 — The dead timer (20 seconds) on R1 expires before the next hello packet from R2 (25 seconds)."},{"id":"cp-10","section":"Checkpoint","question":"To establish a neighbor adjacency two OSPF routers will exchange hello packets. Which two values in the hello packets must match on both routers? (Choose two.)","choices":["dead interval","router priority","list of neighbors","router ID","hello interval"],"correct":["dead interval","hello interval"],"multi":true,"explanation":"Topic 1.2.4 — The hello and dead interval timers contained in a hello packet must be the same on neighboring routers in order to form an adjacency."},{"id":"cp-11","section":"Checkpoint","question":"What is the default router priority value for all Cisco OSPF routers?","choices":["0","1","10","255"],"correct":["1"],"multi":false,"explanation":"Topic 1.2.4 — The router priority value is used in a DR/BDR election. The default priority for all OSPF routers is 1 but it can be manually altered to any value 0 to 255."},{"id":"cp-12","section":"Checkpoint","question":"Which type of OSPFv2 packet contains an abbreviated list of the LSDB of a sending router and is used by receiving routers to check against the local LSDB?","choices":["database description","link-state update","link-state request","link-state acknowledgment"],"correct":["database description"],"multi":false,"explanation":"Topic 1.2.2 — The database description (DBD) packet contains an abbreviated list of the LSDB sent by a neighboring router and is used by receiving routers to check against the local LSDB."},{"id":"cp-13","section":"Checkpoint","question":"In an OSPF network when are DR and BDR elections required?","choices":["when the two adjacent neighbors are interconnected over a point-to-point link","when all the routers in an OSPF area cannot form adjacencies","when the routers are interconnected over a common Ethernet network","when the two adjacent neighbors are in two different networks"],"correct":["when the routers are interconnected over a common Ethernet network"],"multi":false,"explanation":"Topic 1.3.3 — When the routers are interconnected over a common Ethernet network, a designated router (DR) and a backup DR (BDR) must be elected."},{"id":"cp-14","section":"Checkpoint","question":"When an OSPF network is converged and no network topology change has been detected by a router, how often will LSU packets be sent to neighboring routers?","choices":["every 5 minutes","every 10 minutes","every 30 minutes","every 60 minutes"],"correct":["every 30 minutes"],"multi":false,"explanation":"Topic 1.3.4 — After convergence, LSUs are sent only when a topology change is detected or every 30 minutes as a periodic refresh."},{"id":"cp-15","section":"Checkpoint","question":"What will an OSPF router prefer to use first as a router ID?","choices":["a loopback interface that is configured with the highest IP address on the router","any IP address that is configured using the router-id command","the highest active interface IP that is configured on the router","the highest active interface that participates in the routing process because of a specifically configured network statement"],"correct":["any IP address that is configured using the router-id command"],"multi":false,"explanation":"Topic 2.1.4 — The first preference for an OSPF router ID is an explicitly configured 32-bit address via the router-id command. Next is the highest IP on a loopback, then the highest IP on an active physical interface."},{"id":"cp-16","section":"Checkpoint","question":"What are the two purposes of an OSPF router ID? (Choose two.)","choices":["to uniquely identify the router within the OSPF domain","to facilitate router participation in the election of the designated router","to enable the SPF algorithm to determine the lowest cost path to remote networks","to facilitate the establishment of network convergence","to facilitate the transition of the OSPF neighbor state to Full"],"correct":["to uniquely identify the router within the OSPF domain","to facilitate router participation in the election of the designated router"],"multi":true,"explanation":"Topic 2.1.3 — OSPF router ID does not contribute to SPF algorithm calculations, nor does it facilitate the transition of the OSPF neighbor state to Full."},{"id":"cp-17","section":"Checkpoint","question":"If no router ID was manually configured, and a router has loopback interface 192.168.1.100 and physical interfaces with lower IPs, what would the router use as its OSPF router ID?","choices":["10.0.0.1","10.1.0.1","192.168.1.100","209.165.201.1"],"correct":["192.168.1.100"],"multi":false,"explanation":"Topic 2.1.4 — In OSPFv2, if the router ID is not manually configured, the router will choose the highest IPv4 address of its configured loopback interfaces."},{"id":"cp-18","section":"Checkpoint","question":"A network technician issues 'router ospf 11' on a router. What does the number 11 represent?","choices":["the OSPF process ID on R1","the cost of the link to R1","the autonomous system number to which R1 belongs","the administrative distance that is manually assigned to R1","the area number where R1 is located"],"correct":["the OSPF process ID on R1"],"multi":false,"explanation":"Topic 2.1.2 — There is no autonomous system number to configure on OSPF. The process ID is local to the router."},{"id":"cp-19","section":"Checkpoint","question":"An OSPF router has three directly connected networks: 172.16.0.0/16, 172.16.1.0/16, and 172.16.2.0/16. Which OSPF network command would advertise only the 172.16.1.0 network to neighbors?","choices":["router(config-router)# network 172.16.1.0 0.0.255.255 area 0","router(config-router)# network 172.16.0.0 0.0.15.255 area 0","router(config-router)# network 172.16.1.0 255.255.255.0 area 0","router(config-router)# network 172.16.1.0 0.0.0.0 area 0"],"correct":["router(config-router)# network 172.16.1.0 0.0.255.255 area 0"],"multi":false,"explanation":"Topic 2.2.4 — To advertise only the 172.16.1.0/16 network, the wildcard mask must match the first 16-bits exactly (0.0.255.255)."},{"id":"cp-20","section":"Checkpoint","question":"Which three statements describe the results of an OSPF DR/BDR election where R2 has priority 255 and R3 has the highest router ID? (Choose three.)","choices":["R3 will be elected BDR.","The R4 FastEthernet 0/0 priority is 128.","The R4 router ID is 172.16.1.1.","R1 will be elected BDR.","The router ID on R2 is the loopback interface.","R2 will be elected DR."],"correct":["R3 will be elected BDR.","The R4 router ID is 172.16.1.1.","R2 will be elected DR."],"multi":true,"explanation":"Topic 2.3.6 — R2 will be elected DR because it has the highest priority of 255. R3 will be elected BDR because it has the numerically highest router-ID. The R4 router-ID is 172.16.1.1 because it is the IPv4 address on loopback 0."},{"id":"cp-21","section":"Checkpoint","question":"If the switch reboots and all routers have to re-establish OSPF adjacencies, and R4 and R1 have the highest router priorities while R4 has the higher router ID, which routers will become the new DR and BDR?","choices":["Router R4 will become the DR and router R1 will become the BDR.","Router R2 will become the DR and router R3 will become the BDR.","Router R1 will become the DR and router R2 will become the BDR.","Router R4 will become the DR and router R3 will become the BDR."],"correct":["Router R4 will become the DR and router R1 will become the BDR."],"multi":false,"explanation":"Topic 2.3.6 — OSPF DR elections are based on: highest priority (1-255, 0 = never DR), then highest router ID. R4 has the highest router ID among the top-priority routers, so R4 becomes DR and R1 becomes BDR."},{"id":"cp-22","section":"Checkpoint","question":"By default, what is the OSPF cost for any link with a bandwidth of 100 Mb/s or greater?","choices":["100000000","10000","1","100"],"correct":["1"],"multi":false,"explanation":"Topic 2.4.1 — OSPF uses the formula: Cost = 100,000,000 / bandwidth. Because OSPF only uses integers as cost, any bandwidth of 100 Mb/s or greater will equal a cost of 1."},{"id":"cp-23","section":"Checkpoint","question":"What is the OSPF cost to reach a router A LAN 172.16.1.0/24 from router B, connected via a 1544 Kbps serial link, where A's LAN is on a GigabitEthernet interface?","choices":["782","74","128","65"],"correct":["65"],"multi":false,"explanation":"Topic 2.4.3 — Serial link (1544 Kbps): 100,000,000 / 1,544,000 = 64. GigabitEthernet on A: 100,000,000 / 1,000,000,000 = 1. Total = 65."},{"id":"cp-24","section":"Checkpoint","question":"In a corporate environment using single area OSPF, on which router would a default route be statically configured?","choices":["R0-A (the router connecting to the Internet)","ISP, R0-A, R0-B, and R0-C","ISP only","R0-B and R0-C","ISP and R0-A","R0-A, R0-B, and R0-C"],"correct":["R0-A (the router connecting to the Internet)"],"multi":false,"explanation":"Topic 2.5.1 — The default route is applied to the router that connects to the Internet (R0-A). R0-A then distributes that default route using the OSPF routing protocol."},{"id":"cp-25","section":"Checkpoint","question":"What command would be used to determine if a routing protocol-initiated relationship had been made with an adjacent router?","choices":["ping","show ip ospf neighbor","show ip interface brief","show ip protocols"],"correct":["show ip ospf neighbor"],"multi":false,"explanation":"Topic 2.6.1 — The show ip ospf neighbor command shows if two adjacent routers have exchanged OSPF messages in order to form a neighbor relationship."},{"id":"cp-26","section":"Checkpoint","question":"Which command produces output showing neighbor ID, priority, state, dead time, address, and interface columns?","choices":["R1# show ip ospf interface serial0/0/1","R1# show ip route ospf","R1# show ip ospf","R1# show ip ospf neighbor"],"correct":["R1# show ip ospf neighbor"],"multi":false,"explanation":"Topic 2.6.4 — The show ip ospf neighbor command displays the neighbor table with columns for neighbor ID, priority, state, dead time, address, and interface."},{"id":"cp-27","section":"Checkpoint","question":"Which command is used to verify that OSPF is enabled and also provides a list of the networks that are being advertised?","choices":["show ip interface brief","show ip ospf interface","show ip protocols","show ip route ospf"],"correct":["show ip protocols"],"multi":false,"explanation":"Topic 2.6.2 — The show ip protocols command checks that OSPF is enabled and lists the networks that are advertised. The other commands show interface state, OSPF interface detail, or routing table entries."},{"id":"cp-28","section":"Checkpoint","question":"A network administrator has configured OSPFv2 on two Cisco routers but PC1 is unable to connect to PC2. The neighbor adjacency on S0/0 is working. What is the most likely problem?","choices":["Interface Fa0/0 has not been activated for OSPFv2 on router R2.","Interface Fa0/0 is configured as a passive-interface on router R2.","Interface S0/0 is configured as a passive-interface on router R2.","Interface s0/0 has not been activated for OSPFv2 on router R2."],"correct":["Interface Fa0/0 has not been activated for OSPFv2 on router R2."],"multi":false,"explanation":"Topic 2.2.4 — If a LAN network is not advertised using OSPFv2, a remote network will not be reachable. The output displays a successful neighbor adjacency on S0/0, so the LAN interface Fa0/0 is the issue."},{"id":"cp-29","section":"Checkpoint","question":"What is the recommended Cisco best practice for configuring an OSPF-enabled router so that each router can be easily identified when troubleshooting routing issues?","choices":["Configure a value using the router-id command.","Use the highest active interface IP address that is configured on the router.","Use a loopback interface configured with the highest IP address on the router.","Use the highest IP address assigned to an active interface participating in the routing process."],"correct":["Configure a value using the router-id command."],"multi":false,"explanation":"Topic 2.1.4 — Cisco recommends using the router-id command to assign a router ID so each router can be easily and consistently identified."},{"id":"cp-30","section":"Checkpoint","question":"Which step in the link-state routing process is described by a router running an algorithm to determine the best path to each destination?","choices":["load balancing equal-cost paths","declaring a neighbor to be inaccessible","choosing the best route","executing the SPF algorithm"],"correct":["executing the SPF algorithm"],"multi":false,"explanation":"Topic 1.1.3 — Executing the SPF algorithm is the step where a router runs Dijkstra's algorithm against its LSDB to create an SPF tree and determine the best path to every destination."},{"id":"cp-31","section":"Checkpoint","question":"An administrator must advertise the network 192.168.223.0 255.255.254.0 in OSPF. What wildcard mask should be used?","choices":["0.0.1.255","0.0.7.255","0.0.15.255","0.0.31.255"],"correct":["0.0.1.255"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.254.0 inverted gives the wildcard mask 0.0.1.255."},{"id":"cp-32","section":"Checkpoint","question":"What is the format of the router ID on an OSPF-enabled router?","choices":["a unique router host name that is configured on the router","a unique phrase with no more than 16 characters","a 32-bit number formatted like an IPv4 address","an 8-bit number with a decimal value between 0 and 255","a character string with no space"],"correct":["a 32-bit number formatted like an IPv4 address"],"multi":false,"explanation":"Topic 2.1.3 — A router ID is a 32-bit number formatted like an IPv4 address and assigned to uniquely identify a router among OSPF peers."},{"id":"cp-33","section":"Checkpoint","question":"Which of the following is true about OSPF areas and algorithms?","choices":["DUAL is the algorithm used by OSPF.","In multiarea OSPF, all areas must connect to the backbone area.","In single-area OSPF, routers are spread across multiple backbone areas.","EIGRP and OSPF share the same SPF algorithm."],"correct":["In multiarea OSPF, all areas must connect to the backbone area."],"multi":false,"explanation":"Topic 1.1.4 — DUAL is the algorithm used by EIGRP, not OSPF. In multiarea OSPF, all areas must be connected to the backbone area (Area 0)."},{"id":"cp-34","section":"Checkpoint","question":"After modifying the router ID on an OSPF router, what is the preferred method to make the new router ID effective?","choices":["HQ# copy running-config startup-config","HQ# resume","HQ# clear ip route *","HQ# clear ip ospf process"],"correct":["HQ# clear ip ospf process"],"multi":false,"explanation":"Topic 2.1.7 — To modify a router-id on an OSPF-enabled router, it is necessary to reset the OSPF routing process using either the clear ip ospf process command or the reload command."},{"id":"cp-35","section":"Checkpoint","question":"In an OSPFv2 configuration, what is the effect of entering the command 'network 192.168.1.1 0.0.0.0 area 0'?","choices":["It allows all 192.168.1.0 networks to be advertised.","It tells the router which interface to turn on for the OSPF routing process.","It changes the router ID of the router to 192.168.1.1.","It enables OSPF on all interfaces on the router."],"correct":["It tells the router which interface to turn on for the OSPF routing process."],"multi":false,"explanation":"Topic 2.2.4 — A wildcard mask of 0.0.0.0 matches only the exact IP address 192.168.1.1, enabling OSPF only on that specific interface."},{"id":"cp-36","section":"Checkpoint","question":"What is the reason for a network engineer to alter the default reference bandwidth parameter when configuring OSPF?","choices":["to force that specific link to be used in the destination route","to more accurately reflect the cost of links greater than 100 Mb/s","to enable the link for OSPF routing","to increase the speed of the link"],"correct":["to more accurately reflect the cost of links greater than 100 Mb/s"],"multi":false,"explanation":"Topic 2.4.2 — By default, Fast Ethernet, Gigabit, and 10 Gigabit Ethernet interfaces all have a cost of 1. Altering the default reference bandwidth allows each speed to be more accurately reflected in the cost."},{"id":"cp-37","section":"Checkpoint","question":"Which task has to be performed on Router 1 for it to establish an OSPF adjacency with Router 2 when the connecting interfaces are in different subnets due to a wrong subnet mask?","choices":["Issue the clear ip ospf process command.","Change the subnet mask of interface FastEthernet 0/0 to 255.255.255.0.","Remove the passive interface command from interface FastEthernet 0/0.","Add the network 10.0.1.0 0.0.0.255 area 0 command to the OSPF process."],"correct":["Change the subnet mask of interface FastEthernet 0/0 to 255.255.255.0."],"multi":false,"explanation":"Topic 2.6.1 — Each interface on the link connecting the OSPF routers must be in the same subnet for an adjacency to be established. The IP address subnet mask mismatch must be fixed first."},{"id":"cp-38","section":"Checkpoint","question":"Match the description to the term: 'This is the algorithm used by OSPF.'","choices":["Shortest Path First","DUAL","Bellman-Ford","Distance Vector"],"correct":["Shortest Path First"],"multi":false,"explanation":"Topic 1.1.2 — OSPF uses the Shortest Path First (Dijkstra) algorithm. DUAL is used by EIGRP."},{"id":"cp-39","section":"Checkpoint","question":"What is a benefit of multiarea OSPF routing?","choices":["Topology changes in one area do not cause SPF recalculations in other areas.","Routers in all areas share the same link-state database and have a complete picture of the entire network.","A backbone area is not required.","Automatic route summarization occurs by default between areas."],"correct":["Topology changes in one area do not cause SPF recalculations in other areas."],"multi":false,"explanation":"Topic 1.1.5 — With multiarea OSPF, changes to the network topology in one area do not impact other areas, reducing the number of SPF algorithm calculations."},{"id":"cp-40","section":"Checkpoint","question":"What is the correct order of OSPF states from first to last?","choices":["Down → Init → Two-way → ExStart → Exchange → Loading → Full","Init → Down → Two-way → ExStart → Exchange → Full → Loading","Down → Two-way → Init → ExStart → Exchange → Loading → Full","ExStart → Down → Init → Two-way → Exchange → Loading → Full"],"correct":["Down → Init → Two-way → ExStart → Exchange → Loading → Full"],"multi":false,"explanation":"Topic 1.3.2 — The seven OSPF states in order are: Down, Init, Two-way, ExStart, Exchange, Loading, Full."},{"id":"cp-41","section":"Checkpoint","question":"What indicates to a link-state router that a neighbor is unreachable?","choices":["if the router no longer receives hello packets","if the router receives an update with a hop count of 16","if the router receives an LSP with previously learned information","if the router no longer receives routing updates"],"correct":["if the router no longer receives hello packets"],"multi":false,"explanation":"Topic 2.4.7 — OSPF routers send hello packets to monitor the state of a neighbor. When a router stops receiving hello packets from a neighbor, that neighbor is considered unreachable."},{"id":"cp-42","section":"Checkpoint","question":"Which three OSPF states are involved when two routers are forming an adjacency? (Choose three.)","choices":["Exchange","Init","ExStart","Two-way","Loading","Down"],"correct":["Init","Two-way","Down"],"multi":true,"explanation":"Topic 1.3.4 — The Down, Init, and Two-way states are involved in the phase of neighboring router adjacency establishment."},{"id":"cp-43","section":"Checkpoint","question":"Routers B, C, and D have default priority, and router A has priority 0. Which conclusion can be drawn?","choices":["If the priority of router C is changed to 255, then it will become the DR.","Router A will become the DR and router D will become the BDR.","If the DR fails, the new DR will be router B.","If a new router with a higher priority is added to this network, it will become the DR."],"correct":["If the DR fails, the new DR will be router B."],"multi":false,"explanation":"Topic 2.3.7 — Priority 0 means a router cannot become DR. OSPF DR/BDR elections are not preemptive, so a newly added router with higher priority does not take over."},{"id":"cp-44","section":"Checkpoint","question":"An administrator must advertise the network 64.102.0.0 255.255.255.128 in OSPF. What wildcard mask should be used?","choices":["0.0.31.255","0.0.0.63","0.0.63.255","0.0.0.127"],"correct":["0.0.0.127"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.255.128 inverted gives the wildcard mask 0.0.0.127."},{"id":"cp-45","section":"Checkpoint","question":"Which command will a network engineer issue to verify the configured hello and dead timer intervals on a point-to-point WAN serial link between two OSPFv2 routers?","choices":["show ipv6 ospf interface serial 0/0/0","show ip ospf neighbor","show ip ospf interface fastethernet 0/1","show ip ospf interface serial 0/0/0"],"correct":["show ip ospf interface serial 0/0/0"],"multi":false,"explanation":"Topic 2.4.8 — The show ip ospf interface serial 0/0/0 command displays the configured hello and dead timer intervals on a point-to-point serial WAN link between two OSPFv2 routers."},{"id":"cp-46","section":"Checkpoint","question":"An administrator must advertise the network 128.107.0.0 255.255.255.192 in OSPF. What wildcard mask should be used?","choices":["0.0.63.255","0.0.0.63","0.0.0.3","0.0.0.7"],"correct":["0.0.0.63"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.255.192 inverted gives the wildcard mask 0.0.0.63."},{"id":"cp-47","section":"Checkpoint","question":"Match each OSPF packet type to how it is used: A link-state request packet is used to…","choices":["query another router for additional information","establish and maintain adjacencies","compare local topology to that sent by another router","advertise new information"],"correct":["query another router for additional information"],"multi":false,"explanation":"Topic 1.2.2 — LSR packets are sent to query a neighbor for specific link-state records that the local router is missing."},{"id":"cp-48","section":"Checkpoint","question":"An administrator must advertise the network 192.168.181.0 255.255.254.0 in OSPF. What wildcard mask should be used?","choices":["0.0.63.255","0.0.15.255","0.0.1.255","0.0.31.255"],"correct":["0.0.1.255"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.254.0 inverted gives the wildcard mask 0.0.1.255."},{"id":"cp-49","section":"Checkpoint","question":"An administrator must advertise the network 198.19.0.0 255.255.252.0 in OSPF. What wildcard mask should be used?","choices":["0.0.63.255","0.0.3.255","0.0.31.255","0.0.0.255"],"correct":["0.0.3.255"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.252.0 inverted gives the wildcard mask 0.0.3.255."},{"id":"cp-50","section":"Checkpoint","question":"An administrator must advertise the network 128.107.0.0 255.255.252.0 in OSPF. What wildcard mask should be used?","choices":["0.0.3.255","0.0.0.7","0.0.0.3","0.0.63.255"],"correct":["0.0.3.255"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.252.0 inverted gives the wildcard mask 0.0.3.255."},{"id":"cp-51","section":"Checkpoint","question":"Which step in the link-state routing process is described by a router flooding link-state and cost information about each directly connected link?","choices":["building the topology table","selecting the router ID","exchanging link-state advertisements","injecting the default route"],"correct":["exchanging link-state advertisements"],"multi":false,"explanation":"Topic 1.1.3 — Each router floods information regarding the state and cost of its directly connected links to its neighbors during the link-state advertisement exchange step."},{"id":"cp-52","section":"Checkpoint","question":"Which step in the link-state routing process is described by a router sending Hello packets out all OSPF-enabled interfaces?","choices":["electing the designated router","establishing neighbor adjacencies","injecting the default route","exchanging link-state advertisements"],"correct":["establishing neighbor adjacencies"],"multi":false,"explanation":"Topic 1.1.3 — Sending Hello packets out all OSPF-enabled interfaces is the first step: establishing neighbor adjacencies."},{"id":"cp-53","section":"Checkpoint","question":"An administrator must advertise the network 64.100.0.0 255.255.255.0 in OSPF. What wildcard mask should be used?","choices":["0.0.0.31","0.0.0.255","0.0.0.63","0.0.0.127"],"correct":["0.0.0.255"],"multi":false,"explanation":"Topic 2.2.2 — The subnet mask 255.255.255.0 inverted gives the wildcard mask 0.0.0.255."},{"id":"cp-54","section":"Checkpoint","question":"Which step in the link-state routing process is described by a router inserting best paths into the routing table?","choices":["declaring a neighbor to be inaccessible","executing the SPF algorithm","load balancing equal-cost paths","choosing the best route"],"correct":["choosing the best route"],"multi":false,"explanation":"Topic 1.1.3 — After the SPF algorithm creates the SPF tree, the router identifies the shortest paths and inserts them into the routing table — this is the 'choosing the best route' step."},{"id":"cp-55","section":"Checkpoint","question":"What type of address is 64.101.198.197?","choices":["public","private"],"correct":["public"],"multi":false,"explanation":"Topic 2.5.1 — 64.101.198.197 is a public IP address. Private ranges are 10.x.x.x, 172.16–31.x.x, and 192.168.x.x."},{"id":"cp-56","section":"Checkpoint","question":"An OSPF router has three directly connected networks: 172.16.0.0/24, 172.16.1.0/24, and 172.16.2.0/24. Which OSPF network command would advertise only the 172.16.1.0 network to neighbors?","choices":["router(config-router)# network 172.16.1.0 0.0.255.255 area 0","router(config-router)# network 172.16.0.0 0.0.15.255 area 0","router(config-router)# network 172.16.1.0 0.0.0.255 area 0","router(config-router)# network 172.16.1.0 0.0.0.0 area 0"],"correct":["router(config-router)# network 172.16.1.0 0.0.0.255 area 0"],"multi":false,"explanation":"Topic 2.2.4 — To advertise only the 172.16.1.0/24 network, the wildcard mask 0.0.0.255 matches the first 24-bits exactly."},{"id":"cp-57","section":"Checkpoint","question":"Which step in the link-state routing process is described by a router building a link-state database based on received LSAs?","choices":["selecting the router ID","declaring a neighbor to be inaccessible","executing the SPF algorithm","building the topology table"],"correct":["building the topology table"],"multi":false,"explanation":"Topic 1.1.3 — After LSAs are received, OSPF-enabled routers use that information to build the topology table (LSDB), which contains information about all other routers in the network area."}];

  var QUIZ_DATA = {"module1": [{"id": "m1-1.1.7-1", "section": "1.1.7", "sectionTitle": "Check Your Understanding - OSPF Features and Characteristics", "question": "Which of the following OSPF components is associated with the neighbor table?", "choices": ["Dijkstra's algorithm", "Link-State database", "Routing protocol messages", "Adjacency database", "Forwarding database"], "correct": ["Adjacency database"], "multi": false, "explanation": "The neighbor table is built from the adjacency database, which tracks the routers with which OSPF has formed adjacencies."}, {"id": "m1-1.1.7-2", "section": "1.1.7", "sectionTitle": "Check Your Understanding - OSPF Features and Characteristics", "question": "Which of the following OSPF components is responsible for computing the cost of each route?", "choices": ["Dijkstra's algorithm", "Link-State database", "Routing protocol messages", "Adjacency database", "Forwarding database"], "correct": ["Dijkstra's algorithm"], "multi": false, "explanation": "Route cost calculations are performed by Dijkstra's Shortest Path First (SPF) algorithm."}, {"id": "m1-1.1.7-3", "section": "1.1.7", "sectionTitle": "Check Your Understanding - OSPF Features and Characteristics", "question": "Which of the following OSPF components is associated with the topology table?", "choices": ["Dijkstra's algorithm", "Link-State database", "Routing protocol messages", "Adjacency database", "Forwarding database"], "correct": ["Link-State database"], "multi": false, "explanation": "The topology table is built from the link-state database (LSDB), which holds information describing the network topology."}, {"id": "m1-1.1.7-4", "section": "1.1.7", "sectionTitle": "Check Your Understanding - OSPF Features and Characteristics", "question": "Which of the following OSPF components is associated with the routing table?", "choices": ["Dijkstra's algorithm", "Link-State database", "Routing protocol messages", "Adjacency database", "Forwarding database"], "correct": ["Forwarding database"], "multi": false, "explanation": "The routing table is generated from the forwarding database."}, {"id": "m1-1.1.7-5", "section": "1.1.7", "sectionTitle": "Check Your Understanding - OSPF Features and Characteristics", "question": "What is the correct order in the steps for Link-State operation?", "choices": ["1. Execute the SPF Algorithm, 2. Establish Neighbor Adjacencies, 3. Exchange Link-State Advertisements, 4. Choose the Best Route, 5. Build the Topology Table", "1. Establish Neighbor Adjacencies, 2. Choose the Best Route, 3. Build the Topology Table, 4. Execute the SPF Algorithm, 5. Exchange Link-State Advertisements", "1. Establish Neighbor Adjacencies, 2. Exchange Link-State Advertisements, 3. Execute the SPF Algorithm, 4. Choose the Best Route, 5. Build the Topology Table", "1. Establish Neighbor Adjacencies, 2. Exchange Link-State Advertisements, 3. Build the Topology Table, 4. Execute the SPF Algorithm, 5. Choose the Best Route"], "correct": ["1. Establish Neighbor Adjacencies, 2. Exchange Link-State Advertisements, 3. Build the Topology Table, 4. Execute the SPF Algorithm, 5. Choose the Best Route"], "multi": false, "explanation": "OSPF's link-state process runs in this sequence: routers first form neighbor adjacencies, then exchange link-state advertisements, then use that information to build a topology table, then run the SPF algorithm against that table, and finally select the best routes."}, {"id": "m1-1.2.5-1", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following OSPF packets contains an abbreviated list of the LSDB of the sending router?", "choices": ["Type 1: Hello packet", "Type 2: DBD packet", "Type 3: LSR packet", "Type 4: LSU packet", "Type 5: LSAck packet"], "correct": ["Type 2: DBD packet"], "multi": false, "explanation": "The Database Description (DBD) packet carries a condensed summary of the sending router's link-state database."}, {"id": "m1-1.2.5-2", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following OSPF packets is used by routers to announce new information?", "choices": ["Type 1: Hello packet", "Type 2: DBD packet", "Type 3: LSR packet", "Type 4: LSU packet", "Type 5: LSAck packet"], "correct": ["Type 4: LSU packet"], "multi": false, "explanation": "Link-State Update (LSU) packets are how routers advertise new link-state information."}, {"id": "m1-1.2.5-3", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following OSPF packets is used by routers to request more information?", "choices": ["Type 1: Hello packet", "Type 2: DBD packet", "Type 3: LSR packet", "Type 4: LSU packet", "Type 5: LSAck packet"], "correct": ["Type 3: LSR packet"], "multi": false, "explanation": "Link-State Request (LSR) packets are sent when a router needs more detail than what was summarized in a DBD packet."}, {"id": "m1-1.2.5-4", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following OSPF packets is responsible for establishing and maintaining adjacency with other OSPF routers?", "choices": ["Type 1: Hello packet", "Type 2: DBD packet", "Type 3: LSR packet", "Type 4: LSU packet", "Type 5: LSAck packet"], "correct": ["Type 1: Hello packet"], "multi": false, "explanation": "Hello packets discover neighbors and keep adjacencies alive between OSPF routers."}, {"id": "m1-1.2.5-5", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following OSPF packets is used to confirm receipt of an LSA?", "choices": ["Type 1: Hello packet", "Type 2: DBD packet", "Type 3: LSR packet", "Type 4: LSU packet", "Type 5: LSAck packet"], "correct": ["Type 5: LSAck packet"], "multi": false, "explanation": "Link-State Acknowledgment (LSAck) packets confirm that an LSA was received."}, {"id": "m1-1.2.5-6", "section": "1.2.5", "sectionTitle": "Check Your Understanding - OSPF Packets", "question": "Which of the following is used with the Hello Packet to uniquely identify the originating router?", "choices": ["Hello Interval", "Router ID", "Designated Router ID", "Network Mask", "Dead Interval"], "correct": ["Router ID"], "multi": false, "explanation": "The Router ID field in the OSPFv2 Hello packet uniquely identifies the router that sent it."}, {"id": "m1-1.3.7-1", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state on multiaccess networks, the routers elect a Designated Router (DR) and a Backup Designated Router (BDR).", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["Two-Way State"], "multi": false, "explanation": "DR/BDR elections on multiaccess segments take place during the Two-Way state."}, {"id": "m1-1.3.7-2", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state, routers send each other DBD packets.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["Exchange State"], "multi": false, "explanation": "Routers exchange Database Description packets during the Exchange state."}, {"id": "m1-1.3.7-3", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "An OSPF router enters this state when it has received a Hello packet from a neighbor, containing the sending Router ID.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["Init State"], "multi": false, "explanation": "A router moves into the Init state once it receives a Hello packet listing the sender's Router ID."}, {"id": "m1-1.3.7-4", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state on point-to-point networks, the routers decide which router initiates the exchange of DBD packets.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["ExStart State"], "multi": false, "explanation": "On point-to-point links, routers negotiate which one starts the DBD exchange during the ExStart state."}, {"id": "m1-1.3.7-5", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state, routers have converged link-state databases.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["Full State"], "multi": false, "explanation": "Routers reach full convergence, with matching link-state databases, in the Full state."}, {"id": "m1-1.3.7-6", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state, no Hello packets are received.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Loading State", "Full State"], "correct": ["Down State"], "multi": false, "explanation": "The Down state is the starting point, before any Hello packets have been received from a neighbor."}, {"id": "m1-1.3.7-7", "section": "1.3.7", "sectionTitle": "Check Your Understanding - OSPF Operation", "question": "During this OSPF state, routes are processed using the SPF algorithm.", "choices": ["Down State", "Init State", "Two-Way State", "ExStart State", "Exchange State", "Full State", "Loading State"], "correct": ["Full State"], "multi": false, "explanation": "SPF calculations used to build the routing table occur once routers reach the Full state."}, {"id": "m1-1.4.2-1", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What is a function of OSPF hello packets?", "choices": ["to discover neighbors and build adjacencies between them", "to ensure database synchronization between routers", "to send specifically requested link-state records", "to request specific link-state records from neighbor routers"], "correct": ["to discover neighbors and build adjacencies between them"], "multi": false, "explanation": "Hello packets serve three main purposes: discovering and forming adjacencies with neighbors, advertising parameters neighbors must agree on, and electing the DR and BDR."}, {"id": "m1-1.4.2-2", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which OSPF packet contains the different types of link-state advertisements?", "choices": ["LSU", "LSR", "hello", "DBD", "LSAck"], "correct": ["LSU"], "multi": false, "explanation": "Link-State Update packets carry the various LSA types and are used both to answer LSR requests and to announce new link-state information."}, {"id": "m1-1.4.2-3", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which statements describe features of the OSPF topology table? (Choose three.)", "choices": ["After convergence, the table only contains the lowest cost route entries for all known networks.", "The topology table contains feasible successor routes.", "The table can be viewed via the show ip ospf database command.", "Its contents are the result of running the SPF algorithm.", "It is a link-state database that represents the network topology.", "When converged, all routers in an area have identical topology tables."], "correct": ["The table can be viewed via the show ip ospf database command.", "It is a link-state database that represents the network topology.", "When converged, all routers in an area have identical topology tables."], "multi": true, "explanation": "The OSPF topology table is really the link-state database (LSDB): it models the network topology, is viewable with show ip ospf database, and is identical across all routers in an area once converged. 'Feasible successor routes' is an EIGRP concept, not an OSPF one, and keeping only the lowest-cost entries is the job of the routing table produced after the SPF algorithm processes the LSDB, not a property of the topology table itself."}, {"id": "m1-1.4.2-4", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What does an OSPF area contain?", "choices": ["routers that share the same process ID", "routers that share the same router ID", "routers that have the same link-state information in their LSDBs", "routers whose SPF trees are identical"], "correct": ["routers that have the same link-state information in their LSDBs"], "multi": false, "explanation": "Routers in the same OSPF area share identical link-state information, even though each still builds its own SPF tree. Process IDs are locally significant and router IDs are unique per router, so neither one defines an area."}, {"id": "m1-1.4.2-5", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "A router is participating in an OSPFv2 domain. What will always happen if the dead interval expires before the router receives a hello packet from an adjacent DROTHER OSPF router?", "choices": ["A new dead interval timer of 4 times the hello interval will start.", "SPF will run and determine which neighbor router is “down”.", "OSPF will run a new DR/BDR election.", "OSPF will remove that neighbor from the router link-state database."], "correct": ["OSPF will remove that neighbor from the router link-state database."], "multi": false, "explanation": "The default dead interval is four times the hello interval, and once it expires without a Hello being heard, the router always removes that neighbor from its link-state database. SPF doesn't track neighbor state -- it only computes routes -- and a new DR/BDR election isn't guaranteed, since that depends on the network type and whether the lost router was the DR or BDR."}, {"id": "m1-1.4.2-6", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What is the order of packet types used by an OSPF router to establish convergence?", "choices": ["LSAck, Hello, DBD, LSU, LSR", "LSU, LSAck, Hello, DBD, LSR", "Hello, DBD, LSR, LSU, LSAck", "Hello, LSAck, LSU, LSR, DBD"], "correct": ["Hello, DBD, LSR, LSU, LSAck"], "multi": false, "explanation": "OSPF routers converge by progressing through Hello (neighbor discovery), DBD (database summary exchange), LSR (requesting missing details), LSU (sending updates), and finally LSAck (acknowledging receipt)."}, {"id": "m1-1.4.2-7", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What is a feature of the OSPF routing protocol?", "choices": ["OSPF authentication is configured in the same way on IPv4 and IPv6 networks.", "Routers can be grouped into autonomous systems to support a hierarchical system.", "It scales well in both small and large networks.", "The SPF algorithm chooses the best path based on 30-second updates."], "correct": ["It scales well in both small and large networks."], "multi": false, "explanation": "OSPF is valued for scaling well across network sizes. Its authentication approach differs between IPv4 (MD5) and IPv6 (which relies on IPsec instead of a built-in method), routing updates are triggered by changes rather than sent every 30 seconds, and OSPF's hierarchy is built around areas rather than autonomous systems."}, {"id": "m1-1.4.2-8", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What is used to create the OSPF neighbor table?", "choices": ["link-state database", "forwarding database", "routing table", "adjacency database"], "correct": ["adjacency database"], "multi": false, "explanation": "The adjacency database builds the neighbor table; the link-state database builds the topology table, and the forwarding database builds the routing table."}, {"id": "m1-1.4.2-9", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What is identical on all OSPF routers within a single area?", "choices": ["neighbor table", "routing table", "link-state database", "static routes"], "correct": ["link-state database"], "multi": false, "explanation": "Once LSA flooding finishes, every router in an area holds the same link-state information, so the link-state database is identical area-wide."}, {"id": "m1-1.4.2-10", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What function is performed by the OSPF designated router?", "choices": ["summarizing routes between areas", "maintaining the link-state database", "redistribution of external routes into OSPF", "dissemination of LSAs"], "correct": ["dissemination of LSAs"], "multi": false, "explanation": "On multiaccess networks, the designated router's job is to distribute LSAs to the other routers, cutting down on redundant flooding."}, {"id": "m1-1.4.2-11", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What are two reasons for creating an OSPF network with multiple areas? (Choose two.)", "choices": ["to simplify configuration", "to ensure that an area is used to connect the network to the Internet", "to reduce use of memory and processor resources", "to reduce SPF calculations", "to provide areas in the network for routers that are not running OSPF"], "correct": ["to reduce use of memory and processor resources", "to reduce SPF calculations"], "multi": true, "explanation": "Splitting a network into multiple OSPF areas keeps link-state databases smaller and reduces SPF recalculations, easing memory and CPU load. It doesn't simplify configuration (it actually adds steps), has no bearing on Internet connectivity, and areas can only be assigned to routers that are actually running OSPF."}, {"id": "m1-1.4.2-12", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "At which OSPF state are neighbor routers converged and able to exchange routing updates?", "choices": ["Exchange", "Two-Way", "ExStart", "Full"], "correct": ["Full"], "multi": false, "explanation": "Neighbors that reach the Full state are fully converged and can exchange routing information."}, {"id": "m1-1.4.2-13", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "The OSPF hello timer has been set to 15 seconds on a router in a point-to-point network. By default, what is the dead interval on this router?", "choices": ["30 seconds", "60 seconds", "45 seconds", "15 seconds"], "correct": ["60 seconds"], "multi": false, "explanation": "The default dead interval is four times the hello interval, so a 15-second hello timer gives a 60-second dead interval."}, {"id": "m1-1.4.2-14", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What happens immediately after two OSPF routers have exchanged hello packets and have formed a neighbor adjacency?", "choices": ["They exchange abbreviated lists of their LSDBs.", "They negotiate the election process if they are on a multiaccess network.", "They exchange DBD packets in order to advertise parameters such as hello and dead intervals.", "They request more information about their databases."], "correct": ["They negotiate the election process if they are on a multiaccess network."], "multi": false, "explanation": "Right after Hello packets establish an adjacency, routers on a multiaccess network negotiate the DR/BDR election process. DBD packets (carrying abbreviated LSDB summaries) come after that, and LSR requests for further detail follow afterward."}, {"id": "m1-1.4.2-15", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which statement is correct about multiarea OSPF?", "choices": ["OSPF can consolidate a fragmented OSPF area into one large area.", "Arranging routers into areas partitions a large autonomous system in order to lighten the load on routers.", "All routers are in one area called the backbone area (area 0).", "OSPF multiarea increases the frequency of SPF calculation."], "correct": ["Arranging routers into areas partitions a large autonomous system in order to lighten the load on routers."], "multi": false, "explanation": "Multiarea OSPF breaks a large autonomous system into smaller areas specifically to reduce the processing burden on routers, rather than consolidating areas, keeping everything in area 0, or increasing SPF calculations."}, {"id": "m1-1.4.2-16", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which OSPF data structure is identical in all routers in an OSPF area after convergence?", "choices": ["Adjacency database", "Link-state database", "Routing table", "SPF tree"], "correct": ["Link-state database"], "multi": false, "explanation": "Each router calculates its own unique SPF tree, adjacency database, and routing table, but the link-state database for a given area is identical across every router in that area."}, {"id": "m1-1.4.2-17", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What are the purposes of an OSPF router ID? (Choose two.)", "choices": ["To enable the SPF algorithm to determine the lowest-cost path to remote networks", "To facilitate router participation in the election of the designated router", "To facilitate the establishment of network convergence", "To facilitate the transition of the OSPF neighbor state to Full", "To uniquely identify the router within the OSPF domain"], "correct": ["To facilitate router participation in the election of the designated router", "To uniquely identify the router within the OSPF domain"], "multi": true, "explanation": "The router ID's job is to give each router in the OSPF domain a unique identity and to play a role in DR elections. It doesn't factor into SPF cost calculations, doesn't drive the transition to the Full state, and has no direct effect on overall convergence."}, {"id": "m1-1.4.2-18", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which statement describes a multiarea OSPF network?", "choices": ["It consists of multiple network areas that are daisy-chained together.", "It has a core backbone area with other areas connected to the backbone area.", "It has multiple routers that run multiple routing protocols simultaneously, and each protocol consists of an area.", "It requires a three-layer hierarchical network design approach."], "correct": ["It has a core backbone area with other areas connected to the backbone area."], "multi": false, "explanation": "A multiarea OSPF design uses a two-level hierarchy: a backbone area at the core, with every other area connecting directly to it."}, {"id": "m1-1.4.2-19", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "What are the advantages of using multiarea OSPF? (Choose two.)", "choices": ["A backbone area is not required.", "It allows OSPFv2 and OSPFv3 to run together.", "It enables multiple routing protocols to run in a large network.", "It improves routing efficiency by reducing the routing table and linkstate update overhead.", "It improves routing performance by dividing the neighbor table into separate smaller ones.", "Topology changes in one area do not cause SPF recalculations in other areas."], "correct": ["It improves routing efficiency by reducing the routing table and linkstate update overhead.", "Topology changes in one area do not cause SPF recalculations in other areas."], "multi": true, "explanation": "Multiarea OSPF improves efficiency because routes can be summarized between areas, shrinking routing tables and LSA traffic, and because a topology change in one area doesn't trigger SPF recalculation in the others. It doesn't remove the need for a backbone area, and it isn't primarily about mixing routing protocols or running OSPFv2 and OSPFv3 together."}, {"id": "m1-1.4.2-20", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which command can be used to verify the contents of the LSDB in an OSPF area?", "choices": ["show ip ospf database", "show ip ospf interface", "show ip ospf neighbor", "show ip route ospf"], "correct": ["show ip ospf database"], "multi": false, "explanation": "show ip ospf database displays the LSDB contents; the other commands show interface configuration, neighbor information, or routing-table entries instead."}, {"id": "m1-1.4.2-21", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which of the following facilitates hierarchical routing in OSPF?", "choices": ["1. Auto-summarization", "2. Frequent SPF calculations", "3. The election of designated routers", "4. The use of multiple areas"], "correct": ["4. The use of multiple areas"], "multi": false, "explanation": "Dividing an OSPF network into multiple areas is what enables hierarchical routing, since only routers within the same area share full link-state details, keeping routing tables, LSDBs, and SPF workload smaller."}, {"id": "m1-1.4.2-22", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which step does an OSPF-enabled router take immediately after the OSPF router builds the topology table?", "choices": ["Chooses the best path", "Establishes an adjacency with another router", "Exchanges link-state advertisements", "Executes the SPF algorithm"], "correct": ["Executes the SPF algorithm"], "multi": false, "explanation": "The OSPF process flows: form adjacencies, exchange LSAs, build the topology table, run the SPF algorithm, then choose the best routes -- so running SPF is the step right after the topology table is built."}, {"id": "m1-1.4.2-23", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which type of OSPFv2 packet contains an abbreviated list of the LSDB of a sending router and is used by receiving routers to check against the local LSDB?", "choices": ["Database Description", "Link-State Acknowledgment", "Link-State Request", "Link-State Update"], "correct": ["Database Description"], "multi": false, "explanation": "The Database Description (Type 2) packet gives receiving routers an abbreviated summary of the sender's LSDB so they can check it against their own, since the LSDB must match across all routers in an area to build an accurate SPF tree."}, {"id": "m1-1.4.2-24", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "Which OSPF states are performed prior to two routers forming a neighbor adjacency? (Choose three.)", "choices": ["Down", "Exchange", "ExStart", "Init", "Loading", "Two-Way"], "correct": ["Down", "Init", "Two-Way"], "multi": true, "explanation": "Of OSPF's seven states, Down, Init, and Two-Way occur during the process of forming a neighbor adjacency, before the exchange of routing information begins."}, {"id": "m1-1.4.2-25", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "In an OSPF network, when are DR and BDR elections required?", "choices": ["When all the routers in an OSPF area cannot form adjacencies", "When the routers are interconnected over a common Ethernet network", "When the two adjacent neighbors are in two different networks", "When the two adjacent neighbors are interconnected over a point-topoint link"], "correct": ["When the routers are interconnected over a common Ethernet network"], "multi": false, "explanation": "DR and BDR elections happen specifically on multiaccess segments (such as Ethernet), not on point-to-point links or across separate networks."}, {"id": "m1-1.4.2-26", "section": "1.4.2", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Concepts", "question": "When an OSPF network is converged and no network topology change has been detected by a router, how often are LSU packets sent to neighboring routers?", "choices": ["Every 10 seconds", "Every 40 seconds", "Every 15 minutes", "Every 30 minutes"], "correct": ["Every 30 minutes"], "multi": false, "explanation": "Once OSPF has converged and nothing has changed, routers still resend LSUs every 30 minutes as a periodic refresh, in addition to any incremental updates triggered by topology changes."}], "module2": [{"id": "m2-2.1.9-1", "section": "2.1.9", "sectionTitle": "Check Your Understanding - OSPF Router ID", "question": "True or False? In the router ospf process-id command, the process ID value, which can be any number between 1 and 65,535, is locally significant. It must be the same on all routers in the OSPF area.", "choices": ["True", "False"], "correct": ["False"], "multi": false, "explanation": "The process ID is only locally significant to the router it's configured on. It doesn't need to match across routers in the area, though many admins keep it consistent just to avoid confusion."}, {"id": "m2-2.1.9-2", "section": "2.1.9", "sectionTitle": "Check Your Understanding - OSPF Router ID", "question": "Which of the following applies to the router ID? (Choose two)", "choices": ["The router ID cannot be defined by an administrator.", "The router ID is not used to determine the BDR.", "The router ID is used to determine the DR.", "The router ID uniquely identifies the router.", "The router ID is not required."], "correct": ["The router ID is used to determine the DR.", "The router ID uniquely identifies the router."], "multi": true, "explanation": "The router ID gives an OSPF router a unique identity and factors into DR/BDR elections on multiaccess networks -- the highest router ID becomes DR, and the second-highest becomes BDR. An administrator can manually set it, and every OSPF router needs one (whether configured or auto-selected)."}, {"id": "m2-2.1.9-3", "section": "2.1.9", "sectionTitle": "Check Your Understanding - OSPF Router ID", "question": "Which of the following is the order of precedence for choosing the router ID?", "choices": ["1. Router ID that is explicitly configured, 2. Lowest IPv4 loopback address, 3. Lowest active configured IPv4 address", "1. Router ID that is explicitly configured, 2. Lowest active configured IPv4 address, 3. Lowest IPv4 loopback address", "1. Router ID that is explicitly configured, 2. Highest IPv4 loopback address, 3. Highest active configured IPv4 address", "1. Highest IPv4 loopback address, 2. Router ID that is explicitly configured, 3. Highest active configured IPv4 address", "1. Highest IPv4 loopback address, 2. Highest active configured IPv4 address, 3. Router ID that is explicitly configured"], "correct": ["1. Router ID that is explicitly configured, 2. Highest IPv4 loopback address, 3. Highest active configured IPv4 address"], "multi": false, "explanation": "A router first uses a router ID that's been manually configured with the router-id command. If none is set, it falls back to the highest IPv4 address among its configured loopback interfaces, and if there are no loopbacks, it uses the highest active IPv4 address on any physical interface."}, {"id": "m2-2.7.5-1", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which criterion is preferred by the router to choose a router ID?", "choices": ["the IP address of the highest configured loopback interface on the router", "the IP address of the highest active OSPF-enabled interface", "the router-id rid command", "the IP address of the highest active interface on the router"], "correct": ["the router-id rid command"], "multi": false, "explanation": "Cisco routers prefer, in order: an explicitly configured router-id, then the highest IP address on a configured loopback interface, then the highest IP address on any active interface (it doesn't have to be OSPF-enabled)."}, {"id": "m2-2.7.5-2", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which wildcard mask would be used to advertise the 192.168.5.96/27 network as part of an OSPF configuration?", "choices": ["0.0.0.32", "0.0.0.31", "255.255.255.224", "255.255.255.223"], "correct": ["0.0.0.31"], "multi": false, "explanation": "A /27 subnet mask is 255.255.255.224. Subtracting that from 255.255.255.255 gives a wildcard mask of 0.0.0.31."}, {"id": "m2-2.7.5-3", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "The following three networks are directly connected to an OSPF router: 192.168.0.0/24, 192.168.1.0/24, and 192.168.2.0/24. Which OSPF network command would advertise only the 192.168.1.0 network to neighbors?", "choices": ["router(config-router)# network 192.168.1.0 0.0.0.0 area 0", "router(config-router)# network 192.168.1.0 0.0.0.255 area 0", "router(config-router)# network 192.168.1.0 255.255.255.255 area 0", "router(config-router)# network 192.168.0.0 0.0.15.255 area 0"], "correct": ["router(config-router)# network 192.168.1.0 0.0.0.255 area 0"], "multi": false, "explanation": "To match only the 192.168.1.0/24 network, the wildcard mask needs binary zeros across the first 24 bits (matched exactly) and ones across the remaining 8 bits, which is 0.0.0.255."}, {"id": "m2-2.7.5-4", "section": "2.7.5", "sectionTitle": "Module Quiz - Single-Area OSPFv2 Configuration", "question": "Which three parameters should match in order for a pair of routers to form an adjacency when running OSPFv2? (Choose three.)", "choices": ["OSPFv2 process number", "OSPFv2 type of network", "router ID", "interface priority", "hello timer", "subnet mask"], "correct": ["OSPFv2 type of network", "hello timer", "subnet mask"], "multi": true, "explanation": "For two OSPFv2 routers to form an adjacency, their subnet mask, network type, and hello/dead timers need to match (along with any authentication settings). The process ID is only locally significant, r
