  function currentAnswer() {
    return session.answers[session.currentIndex];
  }

  function setAnswer(a) {
    session.answers[session.currentIndex] = a;
  }

  function renderQuiz() {
    if (!session) {
      renderMenu();
      return;
    }
    clear(app);

    var q = session.questions[session.currentIndex];
    var total = session.questions.length;
    var meta = moduleMeta(session.moduleId);

    var topbar = el("div", { className: "topbar" });
    var menuBtn = el("button", { className: "btn btn-ghost", text: "← Menu" });
    menuBtn.addEventListener("click", function () {
      renderMenu();
    });
    topbar.appendChild(menuBtn);
    topbar.appendChild(
      el("div", { className: "module-name", text: "Module " + meta.number })
    );
    app.appendChild(topbar);

    var track = el("div", { className: "progress-track" });
    var fill = el("div", { className: "progress-fill" });
    fill.style.width = Math.round((session.currentIndex / total) * 100) + "%";
    track.appendChild(fill);
    app.appendChild(track);
    app.appendChild(
      el("div", {
        className: "progress-label",
        text: "Question " + (session.currentIndex + 1) + " of " + total
      })
    );

    var card = el("div", { className: "card" });
    card.appendChild(el("div", { className: "section-tag", text: "Section " + q.section }));
    card.appendChild(el("div", { className: "question-text", text: q.question }));

    var saved = currentAnswer();
    var checked = !!(saved && saved.checked);
    var requiredCount = q.multi ? q.correct.length : 1;

    if (q.multi) {
      card.appendChild(
        el("div", {
          className: "multi-hint",
          text: "Select " + requiredCount + " answers."
        })
      );
    }

    var choicesWrap = el("div", { className: "choices" });
    var inputs = [];

    q.choices.forEach(function (choiceText, i) {
      var isMulti = q.multi;
      var inputId = "choice-" + i;
      var label = el("label", {
        className: "choice" + (isMulti ? " multi" : "")
      });

      var input = el("input", {
        attrs: {
          type: isMulti ? "checkbox" : "radio",
          name: "choice-group",
          id: inputId
        }
      });
      input.value = choiceText;

      var wasSelected = saved && saved.selected && saved.selected.indexOf(choiceText) !== -1;
      if (wasSelected) input.checked = true;

      label.appendChild(input);
      label.appendChild(el("span", { className: "mark" }));
      label.appendChild(el("span", { className: "choice-text", text: choiceText }));

      if (checked) {
        input.disabled = true;
        label.classList.add("disabled");
        var isCorrectChoice = q.correct.indexOf(choiceText) !== -1;
        if (isCorrectChoice) {
          label.classList.add("is-correct");
        } else if (wasSelected) {
          label.classList.add("is-wrong");
        }
      }

      choicesWrap.appendChild(label);
      inputs.push(input);
    });

    card.appendChild(choicesWrap);

    var actionBtn = el("button", { className: "btn btn-primary" });

    if (!checked) {
      actionBtn.textContent = "Check Answer";
      actionBtn.disabled = true;

      function refreshInputsState() {
        var checkedCount = inputs.filter(function (i) {
          return i.checked;
        }).length;

        if (q.multi) {
          inputs.forEach(function (i) {
            i.disabled = !i.checked && checkedCount >= requiredCount;
          });
          actionBtn.disabled = checkedCount !== requiredCount;
        } else {
          actionBtn.disabled = checkedCount < 1;
        }

        setAnswer({
          selected: inputs
            .filter(function (i) {
              return i.checked;
            })
            .map(function (i) {
              return i.value;
            }),
          checked: false,
          isCorrect: null
        });
        persist();
      }

      inputs.forEach(function (input) {
        input.addEventListener("change", refreshInputsState);
      });

      if (saved && saved.selected && saved.selected.length) {
        refreshInputsState();
      }

      actionBtn.addEventListener("click", function () {
        var selected = inputs
          .filter(function (i) {
            return i.checked;
          })
          .map(function (i) {
            return i.value;
          });
        var isCorrect = sameSet(selected, q.correct);
        setAnswer({ selected: selected, checked: true, isCorrect: isCorrect });
        if (isCorrect) session.score += 1;
        persist();
        renderQuiz();
      });

      card.appendChild(actionBtn);
    } else {
      var feedback = el("div", {
        className: "feedback " + (saved.isCorrect ? "correct" : "wrong")
      });
      feedback.appendChild(
        el("div", {
          className: "verdict",
          text: saved.isCorrect ? "Correct!" : "Not quite."
        })
      );
      feedback.appendChild(el("div", { className: "explain", text: q.explanation }));
      card.appendChild(feedback);

      var isLast = session.currentIndex === total - 1;
      actionBtn.textContent = isLast ? "Finish Quiz" : "Next Question";
      actionBtn.addEventListener("click", function () {
        if (isLast) {
          renderResults();
        } else {
          session.currentIndex += 1;
          persist();
          renderQuiz();
        }
      });
      card.appendChild(actionBtn);
    }

    app.appendChild(card);
  }

  /* ---------------- results screen ---------------- */

  function renderResults() {
    session.status = "completed";
    wipeSaved();

    clear(app);

    var total = session.questions.length;
    var score = session.score;
    var percent = Math.round((score / total) * 100);
    var meta = moduleMeta(session.moduleId);

    var header = el("div", { className: "page-header" });
    header.appendChild(el("h1", { text: "Quiz Complete" }));
    header.appendChild(
      el("p", { text: "Module " + meta.number + " · " + meta.title })
    );
    app.appendChild(header);

    var card = el("div", { className: "card" });
    var scoreBlock = el("div", { className: "score-block" });
    scoreBlock.appendChild(
      el("div", { className: "score-num", text: score + " / " + total })
    );
    scoreBlock.appendChild(
      el("div", { className: "score-sub", text: percent + "% correct" })
    );

    var msg;
    if (percent === 100) msg = "Perfect run. That whole module is locked in.";
    else if (percent >= 85) msg = "Strong grasp of this module.";
    else if (percent >= 70) msg = "Solid. A little more review and this is locked in.";
    else if (percent >= 50) msg = "Getting there — worth another pass.";
    else msg = "Good starting point — try it again to build recall.";
    scoreBlock.appendChild(el("div", { className: "score-msg", text: msg }));
    card.appendChild(scoreBlock);

    var missed = [];
    session.answers.forEach(function (a, i) {
      if (a && a.checked && !a.isCorrect) {
        missed.push({ q: session.questions[i], a: a });
      }
    });

    if (missed.length) {
      card.appendChild(
        el("div", {
          className: "review-heading",
          text: "Review (" + missed.length + ")"
        })
      );
      var list = el("div", { className: "review-list" });
      missed.forEach(function (item) {
        var box = el("div", { className: "review-item" });
        box.appendChild(el("div", { className: "rq", text: item.q.question }));
        box.appendChild(
          buildAnswerLine("Your answer: ", item.a.selected.join(", "), "wrong")
        );
        box.appendChild(
          buildAnswerLine("Correct answer: ", item.q.correct.join(", "), "right")
        );
        list.appendChild(box);
      });
      card.appendChild(list);
    } else {
      card.appendChild(
        el("div", { className: "all-correct", text: "Every question answered correctly." })
      );
    }

    var btnRow = el("div", { className: "btn-row" });
    var tryAgainBtn = el("button", { className: "btn btn-primary", text: "Try Again" });
    tryAgainBtn.addEventListener("click", function () {
      var moduleId = session.moduleId;
      session = buildSession(moduleId);
      persist();
      renderQuiz();
    });
    var menuBtn = el("button", { className: "btn btn-outline", text: "Back to Menu" });
    menuBtn.addEventListener("click", function () {
      session = null;
      renderMenu();
    });
    btnRow.appendChild(tryAgainBtn);
    btnRow.appendChild(menuBtn);
    card.appendChild(btnRow);

    app.appendChild(card);
  }

  function buildAnswerLine(label, value, cls) {
    var line = el("div", { className: "ra " + cls });
    line.appendChild(document.createTextNode(label));
    var b = el("b", { text: value });
    line.appendChild(b);
    return line;
  }

  /* ---------------- init ---------------- */

  loadSaved().then(function (saved) {
    if (saved && saved.status === "in-progress" && Array.isArray(saved.questions)) {
      session = saved;
    }
    renderMenu();
  });
})();

</script>
</body>
</html>
